<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="从一个小格开始，看相邻公共边的反向积分逐对抵消，最后只留下区域外边界。">
  <title>格林公式的几何直观 · 公共边为什么会抵消</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main class="app">
  <header class="topbar">
    <a class="back-link" href="../index.html#math">← 高等数学</a>
    <div class="heading"><p class="eyebrow">局部的环流，整体的边界</p><h1>格林公式的几何直观</h1></div>
    <label class="density" for="density">区域不变，分块变细
      <select id="density"><option value="3">3 × 2 格</option><option value="6">6 × 4 格</option><option value="9">9 × 6 格</option></select>
    </label>
  </header>
  <section class="stage" aria-label="公共边抵消演示">
    <div class="stage-head"><div class="status"><i id="status-light" aria-hidden="true"></i><output id="time">0.0 s</output><span id="phase">一个小格</span></div><p>已抵消公共边 <strong id="count">0 / 7 对</strong></p></div>
    <div class="scroll-hint">可左右滚动查看完整图</div>
    <div class="stage-scroll"><svg id="scene" viewBox="0 0 1100 530" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">小格的公共边抵消后留下外边界</title>
      <desc id="scene-desc">每个小格沿边界逆时针积分。相邻小格在公共边上方向相反，两项积分相消，未被配对的外边界保留。</desc>
      <defs><pattern id="paper-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#343c38" stroke-opacity=".035"/></pattern></defs>
      <rect width="1100" height="530" fill="url(#paper-grid)"/>
      <g id="geometry"></g><g id="explanation"></g>
    </svg></div>
    <div class="narrative" aria-live="polite"><span id="note-index">01</span><p id="note">先沿一个小格逆时针走一圈，四边贡献之和是环流。</p></div>
    <div class="relation"><span id="local-value">小格环流 1</span><span id="relation-text">每格逆时针 · 区域总面积 6</span><strong id="sum-value">旋度 = 1</strong></div>
  </section>
  <section class="controls" aria-label="播放控制">
    <div class="transport"><button id="restart" aria-label="复位">↺ 复位</button><button id="prev" aria-label="上一步">← 上一步</button><button id="play" class="play">播放</button><button id="next" aria-label="下一步">下一步 →</button>
      <label for="speed">速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      <label class="motion"><input id="reduce-motion" type="checkbox">减少动态效果</label>
    </div>
    <p id="notice" class="notice" hidden></p>
    <label class="progress-row" for="timeline"><span>演示进度</span><input id="timeline" type="range" min="0" max="10000" value="0" step="1"><output id="duration"></output></label>
    <nav class="steps" id="steps" aria-label="阶段跳转"></nav>
  </section>
  <p class="footnote">示意：箭头表示边界积分方向；公共边的双线仅为辨认而错开，抵消的是积分贡献。取 P = −y/2，Q = x/2。</p>
</main>
</body>
</html>
