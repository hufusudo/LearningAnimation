<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时钟页面置换算法 · 改进型 Clock 逐步演示</title>
  <!-- GSAP CDN（补间引擎；加载失败时单步、上一步与进度仍可用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="title-block">
      <a class="back" href="../index.html#os">&larr; 返回展厅</a>
      <h1>时钟页面置换算法 <span class="en">Clock</span></h1>
      <p class="sub">驻留集 4 个页框 · 指针顺时针逐格检查 · 访问位 R 与修改位 M</p>
    </div>
    <div class="top-controls">
      <div class="seg" role="group" aria-label="算法">
        <button type="button" class="seg-btn" data-mode="enhanced" aria-pressed="true">改进型 (R,M)</button>
        <button type="button" class="seg-btn" data-mode="basic" aria-pressed="false">简单 Clock (R)</button>
      </div>
      <label class="field">
        <span>场景</span>
        <select id="scenario">
          <option value="1">1 · 考研经典混合读写</option>
          <option value="2">2 · 一轮速中 (0,0)</option>
          <option value="3">3 · 二轮 R 清零淘汰 (0,1)</option>
          <option value="4">4 · 四轮极限淘汰</option>
          <option value="5">5 · 读写命中测试</option>
        </select>
      </label>
    </div>
  </header>

  <section class="panel sequence" aria-labelledby="seq-title">
    <div class="seq-head">
      <h2 id="seq-title">访问序列</h2>
      <span class="count" id="seq-count"></span>
    </div>
    <div class="seq-row">
      <ol class="track" id="track" aria-label="访问序列，点击跳到该次访问"></ol>
      <form class="append" id="append">
        <label>追加 <input id="append-page" type="number" min="1" max="9" value="5" inputmode="numeric" aria-label="页号"></label>
        <select id="append-op" aria-label="访问类型">
          <option value="R">读</option>
          <option value="W">写</option>
        </select>
        <button type="submit" class="btn">访问</button>
      </form>
    </div>
  </section>

  <div class="workbench">
    <section class="panel stage" aria-label="演示舞台">
      <div class="stage-status">
        <span class="lamp" id="lamp" aria-hidden="true"></span>
        <span class="step-count" id="step-count">第 0 步</span>
        <strong class="phase" id="phase">准备就绪</strong>
        <span class="req-line" id="req-line"></span>
        <span class="cw" aria-hidden="true">指针顺时针 ↻</span>
      </div>

      <svg class="dial" id="dial" viewBox="0 0 720 460" role="img" aria-labelledby="dial-title dial-desc">
        <title id="dial-title">驻留集圆盘</title>
        <desc id="dial-desc">四个页框绕圆盘排列，指针从中心指向当前检查的页框；每个页框显示页号、访问位 R、修改位 M 与类别。</desc>
        <circle class="ring" cx="360" cy="230" r="150"></circle>
        <g id="cards"></g>
        <g id="hand" transform="rotate(0 360 230)">
          <line class="hand-line" x1="360" y1="230" x2="360" y2="112"></line>
          <path class="hand-tip" d="M351 124 L360 104 L369 124 Z"></path>
          <circle class="pivot" cx="360" cy="230" r="9"></circle>
        </g>
        <g id="tags"></g>
      </svg>

      <ul class="legend" id="legend"></ul>
      <p class="narr" id="narr" aria-live="polite"></p>
    </section>

    <aside class="panel side" aria-label="轮次与统计">
      <h2>轮次</h2>
      <ol class="rounds" id="rounds"></ol>
      <p class="rule" id="rule" aria-live="polite"></p>
      <h2>统计</h2>
      <dl class="stats">
        <div><dt>访问</dt><dd id="st-total">0</dd></div>
        <div><dt>命中</dt><dd id="st-hits">0</dd></div>
        <div><dt>缺页</dt><dd id="st-faults">0</dd></div>
        <div><dt>写回</dt><dd id="st-writes">0</dd></div>
      </dl>
    </aside>
  </div>

  <section class="panel controls" aria-label="播放控制">
    <div class="scrub">
      <input id="scrub" class="taste-slider" type="range" min="0" max="0" value="0" aria-label="演示进度（步）">
      <output id="scrub-text" for="scrub">第 0 步</output>
    </div>
    <div class="transport">
      <button type="button" class="btn" id="btn-replay" title="回到第 0 步（Home）">↺ 重播</button>
      <button type="button" class="btn" id="btn-prev" title="上一步（←）">⏮ 上一步</button>
      <button type="button" class="btn-main" id="btn-play" title="播放或暂停（空格）"><span id="play-text">▶ 播放</span></button>
      <button type="button" class="btn" id="btn-next" title="单步：播放下一步的动画（→）">⏭ 单步</button>
    </div>
    <div class="options">
      <div class="seg" role="group" aria-label="播放速度">
        <button type="button" class="seg-btn" data-speed="0.5" aria-pressed="false">0.5×</button>
        <button type="button" class="seg-btn" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" class="seg-btn" data-speed="1.5" aria-pressed="false">1.5×</button>
        <button type="button" class="seg-btn" data-speed="2" aria-pressed="false">2×</button>
      </div>
      <label class="check"><input type="checkbox" id="reduce"> 减少动效</label>
    </div>
    <p class="notice" id="notice" hidden></p>
  </section>

  <p class="foot">示意：驻留集固定 4 个页框，不计磁盘读写耗时。</p>
</div>

<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
