<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="沿着同一份报文，观察 NAT 地址改写、NAPT 端口复用与回包查表分流。">
  <title>NAT 网络地址转换与 NAPT 端口多路复用</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23343c38'/%3E%3Cpath d='M8 15h23m-6-5 6 5-6 5M32 26H9m6-5-6 5 6 5' stroke='white' fill='none' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="heading">
        <a class="back" href="../index.html#net" aria-label="返回计算机网络展厅">← <span>计算机网络</span></a>
        <h1>NAT 地址转换 <span class="title-divider">/</span> NAPT 端口复用</h1>
        <p class="subtitle">跟随一份报文，穿过内网与公网的边界。</p>
      </div>
      <div class="mode-switch" role="group" aria-label="转换模式">
        <button type="button" data-mode="basic" aria-pressed="true"><strong>NAT</strong><span>一对一地址映射</span></button>
        <button type="button" data-mode="napt" aria-pressed="false"><strong>NAPT</strong><span>单地址 · 端口复用</span></button>
      </div>
    </header>

    <section class="scenario-bar" aria-label="演示场景">
      <span class="section-label">观察场景</span>
      <div class="scenario-options" role="group" aria-label="选择场景">
        <button type="button" data-scenario="a" aria-pressed="true"><span>01</span> A 的完整往返</button>
        <button type="button" data-scenario="b" aria-pressed="false"><span>02</span> <span id="scenario-b-label">B 的独立地址</span></button>
        <button type="button" data-scenario="special" aria-pressed="false"><span>03</span> <span id="scenario-special-label">公网地址池耗尽</span></button>
      </div>
    </section>

    <section class="stage" aria-label="网络地址转换演示">
      <div class="stage-top">
        <div class="stage-clock"><span id="state-dot" class="state-dot"></span><span class="mono">t = <span id="clock">0.00</span></span><span class="clock-unit">s</span><span id="phase">到达网关</span></div>
        <span class="stage-counter"><span id="step-count">0 / 9</span><span id="play-state">已暂停</span></span>
      </div>
      <div class="topology-scroll" tabindex="0" aria-label="网络拓扑，窄屏可左右滚动">
        <svg id="topology" viewBox="0 0 1100 465" role="img" aria-labelledby="topology-title topology-desc">
          <title id="topology-title">私网主机、边界路由器与公网服务器</title>
          <desc id="topology-desc">请求向右经过网关改写源字段；响应向左返回，查表还原目的字段。网关下方显示转换表。</desc>
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.6" fill="#d9ddd6"/></pattern>
            <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#a1a99f" stroke-width="1.4"/></marker>
            <marker id="active-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#285fb4" stroke-width="1.5"/></marker>
          </defs>
          <rect width="1100" height="490" fill="url(#grid)"/>
          <rect id="lan-area" x="25" y="61" width="280" height="255" rx="15" class="lan-area"/>
          <text x="45" y="34" class="zone-title">私有网络</text><text x="45" y="51" class="zone-sub mono">192.168.1.0/24</text>
          <text x="445" y="34" class="zone-title">网络边界</text><text x="445" y="51" class="zone-sub">地址在这里改写</text>
          <text x="892" y="34" class="zone-title">公共网络</text><text x="892" y="51" class="zone-sub">远端 Web 服务</text>
          <path d="M730 64V291" class="boundary"/>
          <text x="715" y="307" class="zone-sub" text-anchor="end">LAN</text><text x="745" y="307" class="zone-sub">WAN</text>
          <g class="wires">
            <path d="M265 148H335L403 215H445"/>
            <path d="M265 258H335L403 215"/>
            <path id="wire-c" d="M265 368H335L403 215"/>
            <path d="M655 215H890" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
          </g>
          <path id="active-route" class="active-route" opacity="0" marker-end="url(#active-arrow)"/>
          <g id="host-nodes"></g>
          <g id="router-node">
            <rect x="437" y="138" width="226" height="154" rx="18" id="router-focus" class="focus-ring"/>
            <rect x="445" y="146" width="210" height="138" rx="12" class="device"/>
            <path d="M463 173h16m-5-4 5 4-5 4m5 8h-16m5-4-5 4 5 4" class="device-icon"/>
            <text x="489" y="180" class="device-name">边界路由器</text>
            <text x="639" y="180" text-anchor="end" id="router-mode" class="router-mode mono">NAT</text>
            <text x="550" y="246" text-anchor="middle" id="router-status" class="node-status">等待报文</text>
            <text x="550" y="269" text-anchor="middle" class="node-detail mono">LAN 192.168.1.1</text>
          </g>
          <g id="server-node">
            <rect x="882" y="138" width="196" height="154" rx="18" id="server-focus" class="focus-ring"/>
            <rect x="890" y="146" width="180" height="138" rx="12" class="device"/>
            <rect x="906" y="165" width="16" height="24" rx="2" class="device-icon"/>
            <path d="M910 172h8m-8 7h8" class="device-icon"/>
            <text x="932" y="181" class="device-name">Web 服务器</text>
            <text x="906" y="212" class="endpoint mono">203.0.113.88</text>
            <text x="906" y="234" class="node-detail mono">TCP :80</text>
            <text x="906" y="267" class="node-status" id="server-status">等待请求</text>
          </g>
          <path id="table-link" d="M550 284V325" class="table-link"/>
          <g id="table-area">
            <text x="416" y="330" class="table-title">转换表</text>
            <text x="1080" y="330" text-anchor="end" id="table-count" class="zone-sub mono">表项 0 · 公网 IP 0/2</text>
            <path d="M416 344H1080" class="table-rule"/>
            <text x="432" y="367" class="table-heading">内网地址</text>
            <text x="712" y="367" class="table-heading" id="public-heading">公网地址</text>
            <text x="1035" y="367" text-anchor="middle" class="table-heading" id="key-heading">映射键</text>
            <text x="432" y="410" class="empty-table" id="empty-table">尚无映射 · 报文到达后分配</text>
            <g id="table-rows"></g>
          </g>
          <path id="match-link" class="match-link" pathLength="1" stroke-dasharray="1" opacity="0"/>
          <g id="visual-hint" class="visual-hint" visibility="hidden" aria-hidden="true">
            <path d="M550 132V146" class="hint-stem"/>
            <rect x="408" y="66" width="464" height="66" rx="7" class="hint-surface"/>
            <path d="M410 76V122" class="hint-accent"/>
            <text x="424" y="86" id="hint-title" class="hint-title"></text>
            <text x="856" y="86" text-anchor="end" id="hint-note" class="hint-note"></text>
            <text x="424" y="113" id="hint-from" class="hint-endpoint mono"></text>
            <text x="640" y="113" text-anchor="middle" class="hint-arrow">→</text>
            <text x="663" y="113" id="hint-to" class="hint-endpoint hint-result mono"></text>
          </g>
          <g id="packet" aria-hidden="true">
            <rect x="-47" y="-16" width="94" height="32" rx="6" class="packet-body"/>
            <path id="packet-arrow" d="M-34 -4 -29 0 -34 4" fill="none" stroke="white" stroke-width="1.6"/>
            <text x="8" y="5" text-anchor="middle" class="packet-text" id="packet-label">A · 请求</text>
          </g>
          <g id="event-tag" aria-hidden="true"><rect x="465" y="86" width="170" height="29" rx="5"/><text x="550" y="105" text-anchor="middle" id="event-label"></text></g>
        </svg>
      </div>
      <div class="packet-inspector">
        <div class="inspector-heading"><span><span class="section-label">当前报文</span> <strong id="packet-direction">TCP · 请求</strong></span><span id="rewrite-label">源 → 目的</span></div>
        <div class="packet-fields">
          <div class="packet-field" id="field-sip"><span>源 IP</span><strong id="value-sip" class="mono">192.168.1.2</strong><small id="note-sip">保持不变</small></div>
          <div class="packet-field" id="field-sport"><span>源端口</span><strong id="value-sport" class="mono">50001</strong><small id="note-sport">保持不变</small></div>
          <div class="packet-field" id="field-dip"><span>目的 IP</span><strong id="value-dip" class="mono">203.0.113.88</strong><small id="note-dip">保持不变</small></div>
          <div class="packet-field" id="field-dport"><span>目的端口</span><strong id="value-dport" class="mono">80</strong><small id="note-dport">保持不变</small></div>
        </div>
      </div>
      <div class="stage-caption"><span id="caption-number" class="mono">01</span><p id="caption" aria-live="polite">主机 A 以私网地址和端口 50001 发起请求。</p></div>
    </section>

    <section class="controls" aria-label="播放控制">
      <div class="control-row">
        <div class="playback-buttons">
          <button type="button" id="play" class="primary">▶ 播放</button>
          <button type="button" id="prev">← 上一步</button>
          <button type="button" id="next">下一步 →</button>
          <button type="button" id="reset" aria-label="复位到场景起点">↺ 复位</button>
        </div>
        <div class="settings"><label>速度 <select id="speed" aria-label="播放速度"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.8">1.8×</option></select></label><label class="motion-label"><input type="checkbox" id="reduced">减少动态效果</label></div>
      </div>
      <p id="engine-notice" role="status" hidden>动画引擎未加载。仍可用单步、进度条和场景按钮浏览全部状态。</p>
      <div class="progress-row"><label for="progress" class="section-label">进度</label><input type="range" id="progress" min="0" max="14.4" step="0.01" value="0" aria-label="演示进度"><output id="progress-time" for="progress" class="mono">0.0 / 14.4 s</output></div>
      <nav id="step-buttons" class="step-buttons" aria-label="定位演示步骤"></nav>
    </section>
    <footer>示意：公网 IP 使用文档示例地址；仅演示数据转发，省略 TCP 握手、校验和与映射超时。</footer>
  </main>
</body>
</html>
