<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCP 三次握手与四次挥手 · 计算机专业基础 408</title>

  <!-- GSAP CDN：只负责推进时刻；缺失时播放禁用，单步与进度仍可用 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body data-motion="full">

  <!-- ========================================================================= -->
  <!-- 顶栏：返回链接、标题与模式切换                                             -->
  <!-- ========================================================================= -->
  <header class="top">
    <div class="top-inner">
      <div class="top-left">
        <a class="back-link" href="../index.html#net">
          <span aria-hidden="true">←</span>
          <span>返回学科展厅</span>
        </a>
        <span class="divider" aria-hidden="true"></span>
        <h1 class="title">TCP 三次握手与四次挥手</h1>
      </div>

      <div class="mode-capsule" role="group" aria-label="演示模式">
        <button type="button" class="mode-btn" data-mode="handshake" aria-pressed="true">
          <span class="mb-idx">01</span><span>三次握手</span><span class="mb-sub">建立连接</span>
        </button>
        <button type="button" class="mode-btn" data-mode="wave" aria-pressed="false">
          <span class="mb-idx">02</span><span>四次挥手</span><span class="mb-sub">释放连接</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- ========================================================================= -->
    <!-- 舞台：一个 SVG 视口，构图固定，随容器等比缩放                              -->
    <!-- ========================================================================= -->
    <section class="stage-card" aria-labelledby="stage-heading">
      <div class="stage-head">
        <h2 id="stage-heading" class="stage-heading">双主机时序图</h2>
        <ul class="legend" aria-label="报文颜色图例">
          <li><i class="lg-line" style="--lg:#2563EB"></i>SYN</li>
          <li><i class="lg-line" style="--lg:#399B7B"></i>ACK</li>
          <li><i class="lg-line" style="--lg:#BF8C32"></i>FIN</li>
          <li><i class="lg-line" style="--lg:#5D655F"></i>DATA</li>
          <li class="lg-hint">时间自上而下 ↓</li>
        </ul>
      </div>

      <div class="stage-scroll" role="region" tabindex="0" aria-label="时序舞台，窄屏时可横向滚动">
        <svg id="stage" class="stage" viewBox="0 0 1100 600" role="img" aria-labelledby="stage-title stage-desc">
          <title id="stage-title">TCP 三次握手与四次挥手时序图</title>
          <desc id="stage-desc">客户端与服务端的生命线之间，按拍显示 SYN、SYN+ACK、ACK 或 FIN、ACK、数据与最终 ACK 的飞行，并标出两端状态与序号。</desc>
        </svg>
      </div>

      <p id="explanation" class="explain" aria-live="polite"></p>
    </section>

    <!-- ========================================================================= -->
    <!-- 控制区：播放、单步、速度、阶段与进度                                       -->
    <!-- ========================================================================= -->
    <section class="controls" aria-label="播放控制">
      <div class="ctl-row">
        <div class="ctl-group">
          <button type="button" class="tactile" id="btn-restart">
            <span aria-hidden="true">↺</span><span>重播</span>
          </button>
          <button type="button" class="tactile" id="btn-prev">
            <span aria-hidden="true">‹</span><span>上一步</span>
          </button>
          <button type="button" class="beam-cta" id="btn-play">
            <span class="beam-orbit" aria-hidden="true"></span>
            <span class="beam-core"><span id="play-icon" aria-hidden="true">▶</span><span id="play-text">播放</span></span>
          </button>
          <button type="button" class="tactile" id="btn-next">
            <span>下一步</span><span aria-hidden="true">›</span>
          </button>
        </div>

        <div class="ctl-group ctl-aux">
          <label class="speed-box">
            <span class="speed-label">速度</span>
            <input id="speed" class="paper-slider" type="range" min="0.5" max="2" step="0.1" value="1">
            <output id="speed-out" for="speed">1.0×</output>
          </label>
          <label class="motion-toggle">
            <input id="reduce-motion" type="checkbox">
            <span>减少动效</span>
          </label>
        </div>
      </div>

      <div class="phase-bar" id="phase-bar" role="group" aria-label="阶段跳转"></div>

      <div class="scrub">
        <input id="scrub" class="paper-slider" type="range" min="0" max="7" step="0.01" value="0" aria-label="时间位置">
        <output id="time-out" class="time-out" for="scrub">0.0 / 0.0 s</output>
      </div>

      <p id="notice" class="notice" hidden>动画引擎 GSAP 未加载（需联网），播放已禁用；上一步、下一步、进度与阶段仍可用。</p>
    </section>
  </main>

  <footer class="foot">示意：单程时延统一为 1 s，2MSL 缩短为 2.5 s；省略数据段的确认报文、超时重传与窗口；序号取教材例子。</footer>

  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
