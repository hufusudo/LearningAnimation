<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从一段细丝的密度与长度出发，联动观察微元勾股关系、质量累加与第一类曲线积分。">
  <title>第一类曲线积分 · 沿曲线逐段称重</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main class="shell">
  <header class="heading">
    <a class="back" href="../index.html#math">← 高等数学</a>
    <div class="heading-line"><div><h1>第一类曲线积分</h1><p>沿曲线逐段称重，看见 ds 为什么不可省略。</p></div><span class="heading-formula">M = ∫<sub>L</sub> ρ ds</span></div>
  </header>
  <section class="parameters" aria-label="曲线与分割参数">
    <label>曲线 <select id="curve"><option value="parabola">抛物线 y = x²</option><option value="semicircle">120° 圆弧段</option><option value="line">直线 y = 0.6x + 0.35</option></select></label>
    <label>线密度 <select id="density"><option value="gradient">ρ = x + y</option><option value="uniform">ρ = 1</option></select></label>
    <label class="range-param">分割 <span class="mono">N</span> <input id="segments" type="range" min="4" max="128" value="8" aria-label="分割段数"><output id="n-value" class="mono">8</output></label>
    <label class="segment-param">选段 <input id="selected" type="range" min="1" max="8" value="4" aria-label="选中微元"><output id="selected-value" class="mono">4 / 8</output></label>
  </section>
  <section class="stage" aria-label="曲线、微元与质量累加联动舞台">
    <div class="stage-heading"><span><i id="status-dot"></i><span id="time" class="mono">0.0 s</span><b id="phase">密度着色</b></span><span id="curve-domain" class="mono"></span></div>
    <div class="stage-scroll" tabindex="0" aria-label="演示图，窄窗口可横向滚动">
      <svg id="scene" viewBox="0 0 1100 530" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">第一类曲线积分：曲线微元与质量求和</title>
        <desc id="scene-desc">左侧显示细丝的密度分布与选中弦段，右侧按相同比例放大并显示投影，下方将各段近似质量累加。</desc>
        <defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#343c38" stroke-opacity=".045"/></pattern><linearGradient id="density-ramp"><stop stop-color="#d9b570"/><stop offset="1" stop-color="#805223"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6b7066"/></marker></defs>
        <rect width="1100" height="530" fill="url(#grid)"/>
        <text x="42" y="35" class="section-name">01 / 沿曲线分割</text>
        <text x="685" y="35" class="section-name">02 / 同一小段，局部放大</text>
        <path d="M630 26V365" class="divider"/>
        <g id="axes"></g><g id="wire"></g><g id="chords"></g>
        <g id="selected-mark"><path id="selected-halo" fill="none" stroke="#2563eb" stroke-opacity=".14" stroke-width="20" stroke-linecap="round"/><path id="selected-chord" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle id="point-a" r="4" fill="#2563eb"/><circle id="point-b" r="4" fill="#2563eb"/><text id="selected-label" class="blue-label"></text></g>
        <circle id="focus" fill="none" stroke="#2563eb" stroke-width="2"/>
        <g id="density-legend"><rect x="56" y="337" width="84" height="6" rx="3" fill="url(#density-ramp)"/><text x="56" y="365" class="small" id="rho-min"></text><text x="156" y="345" class="small" id="rho-max"></text></g>
        <text x="56" y="395" id="length" class="small mono"></text>
        <path id="zoom-link" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5"/>
        <line id="flying-chord" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
        <g id="micro"><path id="micro-halo" stroke="#2563eb" stroke-opacity=".1" stroke-width="20" stroke-linecap="round" fill="none"/><path id="micro-chord" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/><g id="triangle"><path id="dx-line" stroke="#6b7066" stroke-width="2" stroke-dasharray="6 5" fill="none"/><path id="dy-line" stroke="#8f6619" stroke-width="2" stroke-dasharray="6 5" fill="none"/><path id="right-angle" stroke="#6b7066" fill="none"/><text id="dx-label" class="small mono"></text><text id="dy-label" class="small mono"></text><text id="ds-label" class="blue-label mono"></text></g><text x="700" y="324" id="micro-info" class="small mono"></text></g>
        <g id="micro-empty"><path d="M740 215h170" stroke="#e5e4dc" stroke-width="2"/><text x="825" y="245" text-anchor="middle" class="small">选中段将在这里放大</text></g>
        <foreignObject x="678" y="349" width="392" height="77"><div xmlns="http://www.w3.org/1999/xhtml" id="local-formula" class="local-formula"></div></foreignObject>
        <g id="event-tag"><rect x="478" y="64" width="116" height="29" rx="5" fill="#eef3fb"/><text id="tag-text" x="536" y="84" text-anchor="middle" class="blue-label"></text></g>
        <path d="M42 424H1058" class="divider"/>
        <text x="42" y="452" class="section-name">03 / 按段累加近似质量</text>
        <text x="718" y="452" text-anchor="end" id="sum-count" class="small mono"></text>
        <path d="M56 506H720" class="baseline"/><g id="mass-bars"></g><path id="mass-link" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5"/>
        <g id="mass-token"><rect x="-25" y="-12" width="50" height="24" rx="4" fill="#2563eb"/><text x="0" y="5" text-anchor="middle" fill="white" font-size="12">ρᵢ ℓᵢ</text></g>
        <text x="780" y="452" class="small">累计 Mₙ / g</text><text id="sum-value" x="780" y="491" class="sum-value mono">0.0000</text>
        <text id="sum-target" x="780" y="516" class="small mono"></text>
      </svg>
    </div>
    <div class="stage-caption"><span id="caption" aria-live="polite"></span><span id="error" class="mono"></span></div>
    <div id="limit-formula" class="limit-formula" aria-label="积分极限公式"></div>
  </section>
  <section class="controls" aria-label="播放与时间控制">
    <div class="transport"><button id="reset">复位</button><button id="prev">← 上一步</button><button id="play" class="primary">播放</button><button id="next">下一步 →</button><label class="speed-label">速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label class="motion-label"><input type="checkbox" id="reduce-motion">减少动效</label><span id="position" class="mono"></span></div>
    <label class="progress-label"><span>演示进度</span><input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="演示进度"><output id="duration" class="mono"></output></label>
    <nav id="steps" class="steps" aria-label="动作时刻"></nav>
    <p id="notice" class="notice" hidden></p>
  </section>
  <footer>示意：x、y 以 cm 计，ρ 以 g/cm 计；有限段取弦长与中点密度，积分参考值由数值积分计算。</footer>
</main>
</body>
</html>
