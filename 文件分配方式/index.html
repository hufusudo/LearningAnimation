<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="追踪连续、隐式链接、FAT与索引分配中，从逻辑块到物理块的寻址过程。">
  <title>文件分配方式 · 从逻辑块到物理块</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="indexed-view.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main>
  <header class="page-heading">
    <div><p class="eyebrow">操作系统 / 文件管理</p><h1>文件分配方式</h1><p class="subtitle">同一个逻辑块，四条不同的寻址路径。</p></div>
    <a class="back" href="../index.html#os">← 返回展厅</a>
  </header>
  <nav class="modes" aria-label="分配方式">
    <button data-mode="contiguous" aria-pressed="true"><span>01</span> 连续分配</button>
    <button data-mode="implicit" aria-pressed="false"><span>02</span> 隐式链接</button>
    <button data-mode="fat" aria-pressed="false"><span>03</span> 显式链接 FAT</button>
    <button data-mode="indexed" aria-pressed="false"><span>04</span> 索引分配</button>
    <button data-mode="comparison" aria-pressed="false" class="compare-tab">四种对比 ↗</button>
  </nav>
  <section class="parameters" aria-label="场景参数">
    <div class="operation-group" aria-label="操作">
      <button data-operation="create" aria-pressed="false">创建</button>
      <button data-operation="access" aria-pressed="true">访问</button>
      <button data-operation="delete" aria-pressed="false">删除</button>
      <button data-operation="feature" aria-pressed="false" id="feature">外部碎片</button>
    </div>
    <div class="fields">
      <label>文件 <select id="file"><option>A</option><option>B</option><option>C</option></select></label>
      <label>长度 <input id="length" type="number" min="1" max="15" value="5"> 块</label>
      <label id="k-label">逻辑块 <input id="k" type="number" min="0" max="4" value="3"></label>
      <label id="level-label" hidden>索引 <select id="level"><option value="1">单级</option><option value="2" selected>二级</option><option value="3">三级</option></select></label>
    </div>
  </section>
  <section class="stage" aria-label="文件分配动画">
    <div class="stage-heading">
      <div class="stage-status"><i id="status-light"></i><span id="time" class="mono">t = 0.00</span><span id="phase">目录就绪</span></div>
      <div id="counters" class="counters"><span>磁盘读取 <strong id="io">0</strong> 次</span><span>内存查表 <strong id="memory">0</strong> 次</span></div>
    </div>
    <div id="single-view" class="diagram-scroll">
      <svg id="diagram" viewBox="0 0 1100 466" role="img" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">文件分配寻址过程</title><desc id="diagram-desc">左侧内存目录，中间地址结构，右侧四十个磁盘块。当前读取与指针路径随事件更新。</desc>
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#d2d5cd" stroke-width="1"/></pattern></defs>
        <g id="scene"></g><g id="motion" aria-hidden="true"></g>
      </svg>
    </div>
    <div id="comparison-view" hidden><div class="comparison-summary"><div><span class="eyebrow">共同演示节拍 · 非真实耗时</span><h2 id="comparison-title">访问逻辑块 3</h2></div><p id="comparison-result" class="mono"></p></div><div class="lane-scroll"><div id="lanes"></div></div></div>
    <div class="stage-bottom"><p id="narration" aria-live="polite"></p><span id="allocation" class="mono"></span></div>
  </section>
  <section class="controls" aria-label="播放控制">
    <div class="control-row">
      <div class="playback"><button id="reset" aria-label="回到起点">↺ 复位</button><button id="prev" aria-label="上一步">← 上一步</button><button id="play" class="primary">播放 <span>▶</span></button><button id="next" aria-label="播放下一个动作并停下" title="播放下一个完整动作；减少动效时直接定位">下一步 →</button></div>
      <div class="preferences"><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label class="motion-label"><input type="checkbox" id="reduced"> 减少动效</label></div>
    </div>
    <div class="progress-row"><span id="step-count" class="mono">00 / 00</span><input id="progress" type="range" min="0" max="1" step="0.01" value="0" aria-label="演示进度"><span id="duration" class="mono"></span></div>
    <div id="events" class="events" aria-label="事件导航"></div>
    <p id="engine-notice" hidden>动画引擎未加载，仍可使用单步、事件导航与进度条。</p>
  </section>
  <footer>示意：t 为演示节拍而非真实耗时；k 从 0 起；目录、FAT 已在内存，索引冷缓存，图为完整结构剖视；多级索引按3个数据块分组、省略空表项，非真实容量限制；各操作独立，创建／删除不计写回。</footer>
</main>
</body>
</html>
