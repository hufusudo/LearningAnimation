<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空间直线间距离与直线投影 | Visualizer Lab</title>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <a class="back" href="../index.html">← 展厅门户</a>
      <span class="mark" aria-hidden="true">L₁L₂</span>
      <div class="titles">
        <h1>空间直线间距离 · 直线投影</h1>
        <p class="subtitle">Skew lines &amp; projection</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="演示模块">
      <button id="tab-module-A" class="tab active" type="button" role="tab" aria-selected="true">① 两直线间的距离</button>
      <button id="tab-module-B" class="tab" type="button" role="tab" aria-selected="false">② 直线在平面上的投影</button>
    </nav>
    <button id="btn-reset-cam" class="ghost-btn" type="button">重置视角</button>
  </header>

  <main class="stage">
    <div id="canvas-container" class="canvas" role="img" aria-label="三维演示舞台：两条直线、公法向与投影"></div>

    <!-- 左上：当前关系与关键量 -->
    <aside class="hud card" aria-live="polite">
      <div class="hud-head">
        <span id="hud-badge" class="badge">异面直线</span>
        <span id="hud-subbadge" class="sub">不共面 · 有唯一公垂线</span>
      </div>
      <div id="hud-body" class="hud-body"></div>
    </aside>

    <!-- 右上：图例与图层开关 -->
    <div id="layers-A" class="layers card">
      <span class="layers-title">图层</span>
      <label><input type="checkbox" data-layer="a-common" checked><i class="dot" style="--c:#B42318"></i>公垂线段</label>
      <label><input type="checkbox" data-layer="a-points" checked><i class="dot" style="--c:#1D4ED8"></i>动点 A、B</label>
      <label><input type="checkbox" data-layer="a-box" checked><i class="dot" style="--c:#5B7C78"></i>平行六面体</label>
      <label><input type="checkbox" data-layer="a-plane" checked><i class="dot" style="--c:#5B7C78"></i>过 L₁ ∥ L₂ 的平面</label>
    </div>
    <div id="layers-B" class="layers card" hidden>
      <span class="layers-title">图层</span>
      <label><input type="checkbox" data-layer="b-plane" checked><i class="dot" style="--c:#5B7C78"></i>平面 π</label>
      <label><input type="checkbox" data-layer="b-drops" checked><i class="dot" style="--c:#6B7066"></i>投影线 ∥ n</label>
      <label><input type="checkbox" data-layer="b-projplane" checked><i class="dot" style="--c:#BF8C32"></i>辅助平面 π′</label>
      <label><input type="checkbox" data-layer="b-projline" checked><i class="dot" style="--c:#399B7B"></i>投影直线 L′</label>
    </div>

    <!-- 底部：讲解卡与参数 -->
    <section class="dock" aria-label="讲解与控制">
      <div id="story-card" class="card story-card">
        <div class="story-top">
          <span id="story-status" class="status-dot" aria-hidden="true"></span>
          <div class="story-head">
            <h2 id="card-title">怎么量两条异面直线的距离？</h2>
            <p id="card-detail" class="detail"></p>
          </div>
          <span id="story-count" class="count">0 / 4</span>
        </div>
        <p id="card-formula" class="formula"></p>
        <div id="stepper" class="stepper" role="group" aria-label="章节"></div>
        <div id="story-track" class="track" aria-hidden="true"><span id="story-fill" class="fill"></span></div>
        <div id="story-controls" class="controls">
          <button id="story-prev" class="ceramic" type="button" aria-label="上一步">← 上一步</button>
          <button id="story-play" class="beam" type="button" aria-label="播放或暂停">播放</button>
          <button id="story-next" class="ceramic" type="button" aria-label="下一步">下一步 →</button>
        </div>
        <p id="story-notice" class="notice" hidden>动画引擎未加载：播放与速度不可用，章节与进度仍可用。</p>
        <span id="free-tag" class="free-tag" hidden>自由探索 · 播放回到讲解</span>
      </div>

      <div id="controls-A" class="card params">
        <div class="row">
          <span class="label">位置关系</span>
          <div class="seg" role="group" aria-label="位置关系">
            <button data-case-a="skew" type="button" class="active">异面</button>
            <button data-case-a="parallel" type="button">平行</button>
            <button data-case-a="intersect" type="button">相交</button>
            <button data-case-a="coincident" type="button">重合</button>
          </div>
          <span class="label">理解方式</span>
          <div class="seg" role="group" aria-label="理解方式">
            <button data-mode-a="vector" type="button" class="active">向量投影</button>
            <button data-mode-a="common" type="button">公垂线 d</button>
            <button data-mode-a="box" type="button">六面体 V/S</button>
            <button data-mode-a="plane" type="button">平面法</button>
          </div>
        </div>
        <div class="row sliders">
          <label class="slider"><span>A 在 L₁ 上 · t</span><output id="val-ta">0.00</output><input id="slider-ta" type="range" min="-5" max="5" step="0.02" value="0"></label>
          <label class="slider"><span>B 在 L₂ 上 · u</span><output id="val-ub">0.00</output><input id="slider-ub" type="range" min="-5" max="5" step="0.02" value="0"></label>
        </div>
      </div>

      <div id="controls-B" class="card params" hidden>
        <div class="row">
          <span class="label">典型位置</span>
          <div class="seg" role="group" aria-label="典型位置">
            <button data-case-b="oblique" type="button" class="active">斜交</button>
            <button data-case-b="parallel" type="button">平行于 π</button>
            <button data-case-b="inside" type="button">在 π 上</button>
            <button data-case-b="pendicular" type="button">垂直于 π</button>
          </div>
          <label class="slider inline"><span>平面倾角 α</span><output id="val-alpha">0°</output><input id="slider-alpha" type="range" min="-45" max="45" step="1" value="0"></label>
        </div>
        <div class="row sliders">
          <label class="slider"><span>动点 M 在 L 上 · t（M′ 描出 L′）</span><output id="val-tb">0.00</output><input id="slider-tb" type="range" min="-5" max="5" step="0.02" value="0"></label>
        </div>
      </div>

      <footer class="foot">
        <div class="foot-left">
          <button id="btn-min" class="ceramic" type="button"><span id="btn-min-text">滑到最近点</span></button>
          <div id="story-speed" class="seg small" role="group" aria-label="播放速度">
            <button type="button" data-speed="0.5">0.5×</button>
            <button type="button" data-speed="1" class="active">1×</button>
            <button type="button" data-speed="2">2×</button>
          </div>
          <button id="story-motion" class="ceramic small" type="button" aria-pressed="false">减少动效</button>
        </div>
        <p class="keys">空格 播放 · ← → 单步 · Home 重播</p>
      </footer>
      <p class="note">示意：距离与投影按构造顺序给出，数值随参数实时变化。</p>
    </section>
  </main>

  <script src="model.js"></script>
  <script src="choreo.js"></script>
  <script src="stage-core.js"></script>
  <script src="stage-a.js"></script>
  <script src="stage-b.js"></script>
  <script src="stage.js"></script>
  <script src="app.js"></script>
</body>
</html>
