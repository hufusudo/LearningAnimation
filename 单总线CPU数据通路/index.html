<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单总线 CPU 数据通路可视化</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'SF Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-amber-100 selection:text-amber-900 bg-[#FAF9F5]">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#FAF9F5]/95 backdrop-blur border-b border-[#E5E4DC] px-4 lg:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <a href="../index.html" class="w-7 h-7 rounded-lg bg-stone-900 text-white flex items-center justify-center font-mono font-bold text-xs hover:bg-stone-700 transition-colors" title="返回目录">&larr;</a>
      <h1 class="text-sm font-semibold text-stone-900 tracking-tight">单总线 CPU 数据通路</h1>
    </div>

    <div class="flex flex-wrap items-center gap-2 text-xs">
      <select id="instruction-select" class="px-2.5 py-1.5 rounded-lg border border-stone-200 bg-white font-mono font-semibold text-stone-900 focus:outline-none cursor-pointer">
        <option value="ADD_MEM">ADD [1008H], ACC (直接寻址)</option>
        <option value="ADD_INDIRECT">ADD (R0), ACC (间接寻址)</option>
        <option value="ADD_REG">ADD R1, ACC (寄存器寻址)</option>
        <option value="ADD_IMM">ADD #42H, ACC (立即寻址)</option>
      </select>
      <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-stone-200 bg-white font-mono">
        <span class="text-stone-500">A=</span>
        <input id="input-op-a" type="text" value="21" class="w-14 bg-transparent font-bold text-stone-900 focus:outline-none">
        <span class="text-stone-300">|</span>
        <span class="text-stone-500">B=</span>
        <input id="input-op-b" type="text" value="42" class="w-14 bg-transparent font-bold text-stone-900 focus:outline-none">
      </div>
      <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-stone-200 bg-white font-mono text-stone-500">
        <span>速度</span>
        <input id="speed-slider" type="range" min="0.3" max="2.5" step="0.1" value="1.0" class="w-20 accent-amber-600 cursor-pointer">
        <span id="speed-val" class="font-bold text-stone-800 w-8">1.0x</span>
      </div>
      <button id="btn-reset" class="px-3 py-1.5 rounded-lg border border-stone-200 bg-white hover:bg-stone-100 font-mono text-stone-700 transition">复位</button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-[1720px] w-full mx-auto p-4 grid grid-cols-1 xl:grid-cols-12 gap-4">

    <!-- Left: Datapath SVG + Timeline -->
    <div class="xl:col-span-8 flex flex-col gap-4">

      <!-- Datapath Canvas -->
      <div class="card-panel rounded-2xl p-3 relative overflow-hidden bg-white">
        <!-- Overlay: current cycle & micro-op -->
        <div class="absolute top-3 left-3 z-10 flex flex-col gap-1 pointer-events-none">
          <div class="flex items-center gap-2 bg-white/95 px-2.5 py-1 rounded-lg border border-stone-200 text-xs shadow-sm">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            <span class="font-mono font-semibold text-stone-800" id="canvas-status-step">时钟周期: T0</span>
          </div>
          <div class="text-[11px] font-mono text-stone-500 bg-white/90 px-2 py-0.5 rounded border border-stone-200 max-w-[460px]" id="canvas-status-rtl">
            微操作: (PC) → MAR
          </div>
        </div>

        <svg id="cpu-svg" viewBox="0 0 1240 940" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M1,1 L7,4 L1,7 Z" fill="#94A3B8" />
            </marker>
            <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
              <path d="M1,1 L8,4.5 L1,8 Z" fill="#2563EB" />
            </marker>
            <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
              <path d="M1,1 L8,4.5 L1,8 Z" fill="#059669" />
            </marker>
            <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
              <path d="M1,1 L8,4.5 L1,8 Z" fill="#7C3AED" />
            </marker>
          </defs>

          <!-- ================= Zones ================= -->
          <rect x="20" y="20" width="780" height="890" rx="14" class="zone-cpu"/>
          <text x="35" y="46" class="zone-label">CPU</text>
          <rect x="910" y="20" width="310" height="890" rx="14" class="zone-mem"/>
          <text x="925" y="46" class="zone-label">主存储器 (按字节编址)</text>

          <!-- ================= 内部单总线主干 ================= -->
          <line id="bus-internal-trunk" x1="560" y1="60" x2="560" y2="890" class="bus-internal-trunk"/>
          <g transform="translate(541,470) rotate(-90)">
            <text text-anchor="middle" class="trunk-label-internal">内部单总线 (Internal Bus)</text>
          </g>

          <!-- ================= 外部系统总线主干 (ABUS / DBUS / CBUS) ================= -->
          <text x="855" y="112" text-anchor="middle" class="bus-label" fill="#2563EB">地址总线 ABUS</text>
          <line id="bus-abus-trunk" x1="800" y1="130" x2="910" y2="130" class="bus-trunk bus-trunk-abus" marker-end="url(#arrow-blue)"/>

          <text x="855" y="352" text-anchor="middle" class="bus-label" fill="#059669">数据总线 DBUS</text>
          <line id="bus-dbus-trunk" x1="800" y1="330" x2="910" y2="330" class="bus-trunk bus-trunk-dbus" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>

          <text x="855" y="457" text-anchor="middle" class="bus-label" fill="#7C3AED">控制总线 CBUS</text>
          <line id="bus-cbus-trunk" x1="800" y1="475" x2="910" y2="475" class="bus-trunk bus-trunk-cbus" marker-end="url(#arrow-purple)"/>

          <!-- ================= PC 子系统 ================= -->
          <rect id="box-pc-adder" x="60" y="90" width="130" height="80" rx="8" class="component-box"/>
          <text x="125" y="122" text-anchor="middle" class="comp-title">+4 自增器</text>
          <text x="125" y="144" text-anchor="middle" class="comp-sub">专用加法器</text>

          <polygon id="box-pc-mux" points="220,95 280,110 280,150 220,165" class="component-box"/>
          <text x="250" y="136" text-anchor="middle" class="comp-title">MUX</text>
          <text id="sig-pcmuxsel" x="250" y="208" text-anchor="middle" class="signal-badge inactive">PC_MUX_SEL</text>

          <rect id="box-pc" x="320" y="95" width="160" height="70" rx="8" class="component-box"/>
          <text x="332" y="120" class="comp-title">PC 程序计数器</text>
          <text id="val-pc" x="400" y="150" text-anchor="middle" class="comp-val">0x0800</text>

          <path id="wire-adder-to-mux" d="M 190,115 L 220,115" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <path id="wire-pc-to-adder" d="M 320,158 L 310,158 L 310,192 L 125,192 L 125,170" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <path id="wire-bus-to-mux" d="M 560,60 L 560,40 L 250,40 L 250,98" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <path id="wire-mux-to-pc" d="M 280,130 L 320,130" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text id="sig-pcin" x="300" y="121" text-anchor="middle" class="pin-label">PC_in</text>
          <path id="wire-pc-to-bus" d="M 480,130 L 560,130" class="bus-internal-wire"/>
          <polygon id="gate-pcout" points="505,120 525,130 505,140" class="tristate-gate"/>
          <text id="sig-pcout" x="515" y="110" text-anchor="middle" class="signal-badge inactive">PC_out</text>

          <!-- ================= IR 与 CU ================= -->
          <rect id="box-ir" x="60" y="280" width="200" height="80" rx="8" class="component-box"/>
          <text x="72" y="305" class="comp-title">IR 指令寄存器</text>
          <text id="val-ir" x="160" y="338" text-anchor="middle" class="comp-val">0x00000000</text>

          <path id="wire-ir-to-bus" d="M 260,310 L 560,310" class="bus-internal-wire" stroke-dasharray="4 3"/>
          <polygon id="gate-irout" points="455,302 475,310 455,318" class="tristate-gate"/>
          <text id="sig-irout" x="465" y="294" text-anchor="middle" class="signal-badge inactive">IR_out</text>
          <path id="wire-bus-to-ir" d="M 560,345 L 260,345" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text id="sig-irin" x="420" y="372" text-anchor="middle" class="pin-label">IR_in</text>

          <rect id="box-cu" x="60" y="420" width="240" height="90" rx="10" class="component-box cu-box"/>
          <text x="74" y="447" class="comp-title">CU 控制器 (微操作序列发生器)</text>
          <text id="cu-op-desc" x="74" y="470" class="comp-sub">当前指令: ADD [1008H], ACC</text>
          <text x="74" y="492" class="comp-sub">向各部件发射控制信号 →</text>
          <path d="M 160,360 L 160,420" class="wire-opcode" marker-end="url(#arrow-purple)"/>
          <text x="166" y="396" class="comp-sub">Opcode</text>

          <!-- CBUS 引线: CU → 外部控制总线 -->
          <path id="wire-cbus" d="M 300,475 L 800,475" class="bus-cbus-line"/>
          <text id="sig-memread" x="855" y="500" text-anchor="middle" class="signal-badge inactive">MEM_Read</text>
          <text id="sig-memwrite" x="855" y="520" text-anchor="middle" class="signal-badge inactive">MEM_Write</text>

          <!-- ================= Y / ALU / Z ================= -->
          <rect id="box-y" x="350" y="420" width="150" height="85" rx="8" class="component-box"/>
          <text x="362" y="447" class="comp-title">Y 暂存器</text>
          <text id="val-y" x="425" y="482" text-anchor="middle" class="comp-val">0x00000000</text>
          <path id="wire-bus-to-y" d="M 560,465 L 500,465" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text id="sig-yin" x="528" y="452" text-anchor="middle" class="pin-label">Y_in</text>

          <path id="wire-y-to-alu" d="M 410,505 L 410,545" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text x="398" y="530" text-anchor="end" class="comp-sub">操作数 A</text>

          <polygon id="box-alu" points="360,545 490,545 460,655 390,655" class="component-box alu-box"/>
          <text x="425" y="592" text-anchor="middle" class="comp-title">ALU</text>
          <text id="alu-op-label" x="425" y="616" text-anchor="middle" class="comp-sub">ADD</text>
          <text id="sig-aluadd" x="425" y="642" text-anchor="middle" class="signal-badge inactive">ALU_ADD</text>
          <path id="wire-bus-to-alu" d="M 560,600 L 477,600" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text x="505" y="588" text-anchor="middle" class="comp-sub">操作数 B</text>

          <g transform="translate(250,555)">
            <rect x="0" y="0" width="64" height="44" rx="5" fill="#FFFFFF" stroke="#E5E4DC"/>
            <text x="7" y="17" class="comp-sub">Z:<tspan id="flag-z" class="font-bold" fill="#1C1917">0</tspan> C:<tspan id="flag-c" class="font-bold" fill="#1C1917">0</tspan></text>
            <text x="7" y="36" class="comp-sub">S:<tspan id="flag-s" class="font-bold" fill="#1C1917">0</tspan> V:<tspan id="flag-v" class="font-bold" fill="#1C1917">0</tspan></text>
          </g>

          <path id="wire-alu-to-z" d="M 425,635 L 425,645" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text id="sig-zin" x="434" y="646" class="pin-label">Z_in</text>

          <rect id="box-z" x="360" y="645" width="135" height="65" rx="8" class="component-box"/>
          <text x="372" y="668" class="comp-title">Z 暂存器</text>
          <text id="val-z" x="428" y="696" text-anchor="middle" class="comp-val">0x00000000</text>
          <path id="wire-z-to-bus" d="M 495,678 L 560,678" class="bus-internal-wire"/>
          <polygon id="gate-zout" points="500,670 518,678 500,686" class="tristate-gate"/>
          <text id="sig-zout" x="508" y="662" text-anchor="middle" class="signal-badge inactive">Z_out</text>

          <!-- ================= 通用寄存器 R0 / R1 / ACC ================= -->
          <rect id="box-r0" x="60" y="690" width="180" height="65" rx="8" class="component-box"/>
          <text x="72" y="715" class="comp-title">R0 通用寄存器</text>
          <text id="val-r0" x="150" y="744" text-anchor="middle" class="comp-val">0x00001008</text>
          <path id="wire-r0-to-bus" d="M 240,728 L 560,728" class="bus-internal-wire"/>
          <polygon id="gate-r0out" points="390,720 410,728 390,736" class="tristate-gate"/>
          <text id="sig-r0out" x="400" y="714" text-anchor="middle" class="signal-badge inactive">R0_out</text>

          <rect id="box-r1" x="60" y="770" width="180" height="65" rx="8" class="component-box"/>
          <text x="72" y="795" class="comp-title">R1 通用寄存器</text>
          <text id="val-r1" x="150" y="824" text-anchor="middle" class="comp-val">0x0000002A</text>
          <path id="wire-r1-to-bus" d="M 240,802 L 560,802" class="bus-internal-wire"/>
          <polygon id="gate-r1out" points="390,794 410,802 390,810" class="tristate-gate"/>
          <text id="sig-r1out" x="400" y="788" text-anchor="middle" class="signal-badge inactive">R1_out</text>

          <rect id="box-acc" x="60" y="850" width="180" height="60" rx="8" class="component-box"/>
          <text x="72" y="873" class="comp-title">ACC 累加器</text>
          <text id="val-acc" x="150" y="900" text-anchor="middle" class="comp-val">0x00000015</text>
          <path id="wire-bus-to-acc" d="M 560,868 L 240,868" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text id="sig-accin" x="360" y="860" text-anchor="middle" class="pin-label">ACC_in</text>
          <path id="wire-acc-to-bus" d="M 240,888 L 560,888" class="bus-internal-wire"/>
          <polygon id="gate-accout" points="390,880 410,888 390,896" class="tristate-gate"/>
          <text id="sig-accout" x="400" y="876" text-anchor="middle" class="signal-badge inactive">ACC_out</text>

          <!-- ================= MAR (CPU 侧地址接口) ================= -->
          <rect id="box-mar" x="620" y="95" width="160" height="70" rx="8" class="component-box"/>
          <text x="632" y="120" class="comp-title">MAR 地址寄存器</text>
          <text id="val-mar" x="700" y="150" text-anchor="middle" class="comp-val">0x0800</text>
          <path id="wire-bus-to-mar" d="M 560,130 L 620,130" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text id="sig-marin" x="590" y="121" text-anchor="middle" class="pin-label">MAR_in</text>
          <path id="wire-mar-to-abus" d="M 780,130 L 800,130" class="bus-abus-line"/>

          <!-- ================= MDR (CPU 侧数据接口, 双向中继) ================= -->
          <rect id="box-mdr" x="620" y="260" width="160" height="120" rx="8" class="component-box"/>
          <text x="632" y="288" class="comp-title">MDR 数据缓冲寄存器</text>
          <text id="val-mdr" x="700" y="322" text-anchor="middle" class="comp-val">0x00000000</text>
          <text x="700" y="360" text-anchor="middle" class="comp-sub">内总线 ↔ 外总线</text>
          <path id="wire-bus-to-mdr" d="M 560,310 L 620,310" class="bus-internal-wire" marker-end="url(#arrow-gray)"/>
          <text id="sig-mdrin" x="590" y="301" text-anchor="middle" class="pin-label">MDR_in</text>
          <path id="wire-mdr-to-bus" d="M 620,350 L 560,350" class="bus-internal-wire"/>
          <polygon id="gate-mdrout" points="600,342 600,358 580,350" class="tristate-gate"/>
          <text id="sig-mdrout" x="588" y="378" text-anchor="middle" class="signal-badge inactive">MDR_out</text>
          <path id="wire-mdr-to-dbus" d="M 780,330 L 800,330" class="bus-dbus-line"/>
          <text id="sig-mdrine" x="790" y="300" text-anchor="middle" class="signal-badge inactive">MDR_inE</text>
          <text id="sig-mdroute" x="788" y="364" text-anchor="middle" class="signal-badge inactive">MDR_outE</text>

          <!-- ================= 主存 ================= -->
          <g id="comp-main-memory">
            <rect x="925" y="80" width="260" height="50" rx="6" class="mem-decoder"/>
            <text x="937" y="100" class="comp-sub">地址译码器</text>
            <text id="mem-decoded-addr" x="1173" y="118" text-anchor="end" class="comp-val">MAR = 0x0800</text>
            <path d="M 910,130 L 925,130" class="bus-abus-line" marker-end="url(#arrow-gray)"/>

            <rect x="925" y="315" width="260" height="30" rx="6" class="mem-decoder"/>
            <text x="1055" y="334" text-anchor="middle" class="comp-sub">双向数据接口 (↔ DBUS)</text>
            <path d="M 910,330 L 925,330" class="bus-dbus-line"/>

            <!-- 0x0800 指令 -->
            <g id="mem-row-0800" class="memory-svg-row" transform="translate(925,150)">
              <rect x="0" y="0" width="260" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
              <text x="8" y="18" class="comp-sub">0x0800 (指令区: ADD)</text>
              <rect x="8" y="28" width="52" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
              <text x="34" y="45" text-anchor="middle" class="comp-sub">0x02</text>
              <rect x="74" y="28" width="52" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
              <text x="100" y="45" text-anchor="middle" class="comp-sub">0x00</text>
              <rect x="140" y="28" width="52" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
              <text x="166" y="45" text-anchor="middle" class="comp-sub">0x10</text>
              <rect x="206" y="28" width="46" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
              <text x="229" y="45" text-anchor="middle" class="comp-sub">0x08</text>
              <text x="8" y="80" class="comp-sub">机器码: 0x02001008</text>
            </g>

            <!-- 0x0804 下一条指令 -->
            <g id="mem-row-0804" class="memory-svg-row" transform="translate(925,255)">
              <rect x="0" y="0" width="260" height="55" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
              <text x="8" y="22" class="comp-sub">0x0804 (下一条指令)</text>
              <text x="8" y="44" class="comp-sub">0x00000000 (HALT)</text>
            </g>

            <!-- 0x1008 数据 -->
            <g id="mem-row-1008" class="memory-svg-row" transform="translate(925,355)">
              <rect x="0" y="0" width="260" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
              <text x="8" y="18" class="comp-sub">0x1008 (数据区: 操作数 B)</text>
              <rect x="8" y="28" width="52" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
              <text id="mem-byte-1008-0" x="34" y="45" text-anchor="middle" class="comp-sub">0x00</text>
              <rect x="74" y="28" width="52" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
              <text id="mem-byte-1008-1" x="100" y="45" text-anchor="middle" class="comp-sub">0x00</text>
              <rect x="140" y="28" width="52" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
              <text id="mem-byte-1008-2" x="166" y="45" text-anchor="middle" class="comp-sub">0x00</text>
              <rect x="206" y="28" width="46" height="26" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
              <text id="mem-byte-1008-3" x="229" y="45" text-anchor="middle" class="comp-sub">0x2A</text>
              <text id="mem-val-1008" x="8" y="80" class="comp-sub">数值: 0x0000002A (42)</text>
            </g>

            <!-- 读写控制 -->
            <rect x="925" y="455" width="260" height="40" rx="6" class="mem-decoder"/>
            <text x="937" y="473" class="comp-sub">读写控制电路 (R/W Control)</text>
            <text x="937" y="489" class="comp-sub">由 CBUS: MEM_Read / MEM_Write 驱动</text>
            <path d="M 910,475 L 925,475" class="bus-cbus-line" marker-end="url(#arrow-gray)"/>

            <!-- 状态灯 -->
            <g transform="translate(925,585)">
              <rect x="0" y="0" width="260" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
              <circle id="mem-status-led" cx="20" cy="18" r="6" fill="#94A3B8"/>
              <text id="mem-status-text" x="35" y="22" class="comp-sub">存储器状态: 空闲 (IDLE)</text>
            </g>
          </g>

          <!-- ================= 数据包 (GSAP 驱动) ================= -->
          <g id="flow-token-layer" pointer-events="none">
            <g id="data-packet" opacity="0">
              <rect id="packet-body" x="-46" y="-16" width="92" height="32" rx="16" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5"/>
              <text id="data-packet-text" y="5" text-anchor="middle" class="packet-text">0x0800</text>
            </g>
          </g>
        </svg>

        <!-- Bus legend -->
        <div class="flex flex-wrap items-center justify-center gap-4 text-[10px] font-mono text-stone-500 pt-2 border-t border-stone-100 mt-2">
          <span class="flex items-center gap-1.5"><span class="w-4 h-1.5 rounded-full" style="background:#D97706"></span>内部单总线</span>
          <span class="flex items-center gap-1.5"><span class="w-4 h-1.5 rounded-full" style="background:#2563EB"></span>地址总线 ABUS (CPU→主存)</span>
          <span class="flex items-center gap-1.5"><span class="w-4 h-1.5 rounded-full" style="background:#059669"></span>数据总线 DBUS (双向)</span>
          <span class="flex items-center gap-1.5"><span class="w-4 h-1.5 rounded-full border border-dashed border-purple-400"></span>控制总线 CBUS</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full" style="background:#F59E0B"></span>数据包随总线变色</span>
        </div>
      </div>

      <!-- Timeline -->
      <div class="card-panel rounded-2xl p-3 flex flex-col gap-2">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <button id="btn-play-pause" class="px-4 py-2 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-mono text-xs font-semibold transition">
              <span id="play-icon">▶</span>
              <span id="play-text">自动播放</span>
            </button>
            <button id="btn-step-prev" class="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-800 font-mono text-xs transition">◀ 上一步</button>
            <button id="btn-step-next" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-mono text-xs font-semibold transition">下一步 (T+1) ▶</button>
          </div>
          <span class="text-[11px] font-mono text-stone-400">点击任意节拍跳转</span>
        </div>
        <div class="pt-2 border-t border-stone-200/80 flex items-center gap-1 overflow-x-auto pb-1" id="timeline-container"></div>
      </div>

    </div>

    <!-- Right: Step / Signals / Registers -->
    <div class="xl:col-span-4 flex flex-col gap-4">

      <!-- Current micro-step -->
      <div class="card-panel rounded-2xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span id="badge-phase" class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-blue-100 text-blue-800">取指周期</span>
            <span id="badge-cycle-num" class="font-mono font-bold text-stone-900 text-sm">T0 时钟节拍</span>
          </div>
          <span class="text-[11px] font-mono text-stone-400">Micro-Op &amp; RTL</span>
        </div>
        <div class="bg-stone-50 p-3 rounded-xl border border-stone-200">
          <div class="text-[11px] font-mono text-stone-500 mb-1">数据通路操作 (RTL):</div>
          <div id="rtl-formula" class="font-mono font-bold text-stone-900 text-sm overflow-x-auto">(PC) → MAR</div>
        </div>
        <p id="hardware-action-desc" class="text-xs leading-relaxed text-stone-600">
          PC 中的指令地址经三态门送上内部单总线，MAR 输入门开启，时钟上升沿将地址打入 MAR。
        </p>
      </div>

      <!-- Control signal matrix -->
      <div class="card-panel rounded-2xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold tracking-wider text-stone-700 font-mono">控制信号 (Control Signals)</h3>
          <span class="text-[11px] font-mono text-emerald-600 font-semibold" id="active-signals-count">有效: 0 个</span>
        </div>
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-1.5" id="signal-matrix-grid"></div>
      </div>

      <!-- Register monitor -->
      <div class="card-panel rounded-2xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold tracking-wider text-stone-700 font-mono">寄存器状态 (Registers)</h3>
          <span class="text-[11px] font-mono text-stone-400">实时数值</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-xs font-mono text-left">
            <thead>
              <tr class="border-b border-stone-200 text-stone-500">
                <th class="py-1">部件</th>
                <th class="py-1">Hex</th>
                <th class="py-1">说明</th>
              </tr>
            </thead>
            <tbody id="register-table-body" class="divide-y divide-stone-100 text-stone-800"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
