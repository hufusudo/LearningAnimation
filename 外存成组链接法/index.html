<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f5">
  <meta name="description" content="看清成组链接法的四个动作：栈顶分配、读入下一组、满栈写回和压栈回收。可暂停、逐步和回看。">
  <title>外存成组链接法 · 可视化实验室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23faf9f5'/%3E%3Cpath d='M7 8h18M7 16h18M7 24h18' stroke='%23343c38' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="model.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html#os">← 返回计算机操作系统</a>
    <span>可视化实验室</span>
    <span class="header-note">文件管理 · 空闲空间</span>
  </header>
  <main>
    <div class="title-row">
      <h1>外存成组链接法<span class="english-name">Grouped free list</span></h1>
      <p class="subtitle">平时只动内存中的盘块号；一组用完再读下一组，栈满了才整组写回外存。</p>
    </div>

    <section class="stage" id="stage" aria-label="成组链接法动画">
      <div class="stage-heading">
        <div class="stage-status">
          <i class="led" aria-hidden="true"></i>
          <span class="clock"><span>t</span><output id="clock" for="progress">0.0</output></span>
          <span class="phase" id="phase">栈顶分配</span>
        </div>
        <div class="chapters" role="group" aria-label="定位演示章节">
          <button id="chapter-allocate" type="button" aria-pressed="true">分配</button>
          <button id="chapter-reclaim" type="button" aria-pressed="false">回收</button>
        </div>
      </div>
      <div class="stage-scroll" tabindex="0" aria-label="成组链接示意图，窄屏下可横向滚动">
        <svg id="sand" viewBox="0 0 1100 440" role="img" aria-labelledby="sand-title" aria-describedby="sand-desc accessible-state">
          <title id="sand-title">内存地址栈、外存组链与已分配盘块</title>
          <desc id="sand-desc">内存只保存一组空闲盘块号。普通分配弹出栈顶；只剩 next 时先读组信息，再分配组载体。满栈回收把整栈写进回收盘块，让它成为新链首。</desc>
        </svg>
      </div>
      <p class="scroll-hint">示意图可左右滑动查看</p>
      <p id="accessible-state" class="sr-only" role="status" aria-live="polite"></p>
      <div class="stage-foot">
        <p id="caption" class="caption" aria-live="polite"></p>
        <span id="counts" class="counts"></span>
      </div>
    </section>

    <section class="playback" aria-label="演示播放控制">
      <div class="transport">
        <button id="reset" class="tactile" type="button" title="重新开始（Home）">↺<span>重播</span></button>
        <button id="previous" class="tactile" type="button" title="上一步（←）">‹<span>上一步</span></button>
        <button id="play" class="beam-cta" type="button" title="播放或暂停（空格）"><span id="play-symbol" aria-hidden="true">▶</span><span id="play-label">播放</span></button>
        <button id="next" class="tactile" type="button" title="下一步（→）"><span>下一步</span>›</button>
      </div>
      <div class="progress-control">
        <label for="progress" class="sr-only">演示时刻</label>
        <input id="progress" class="taste-slider" type="range" min="0" max="24" step="0.01" value="0">
        <div class="progress-meta"><span>开始</span><output id="progress-caption" for="progress"></output></div>
      </div>
      <label class="speed-control" for="speed">速度
        <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      </label>
      <label class="motion-control" for="reduce-motion"><input id="reduce-motion" type="checkbox"><span>减少动效</span></label>
    </section>

    <nav class="operation-rail" aria-label="点击操作定位并暂停">
      <div class="rail-heading"><span>四次分配</span><span>把这四块回收</span></div>
      <div id="operations" class="operations"></div>
    </nav>
    <p id="dependency-notice" class="dependency-notice" hidden>动画引擎未加载。仍可用上一步、下一步、进度条和操作节点查看全部状态；联网后刷新可恢复播放。</p>
    <footer class="page-foot">
      <span>示意：容量 4，count 包含底部 next 槽；null 只表示链尾，不是盘块。</span>
      <span>空格播放 / 暂停 · ← → 逐步 · Home 复位</span>
    </footer>
  </main>
</body>
</html>
