<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伙伴系统动态分区分配与回收 · 逐步演示</title>
  <!-- GSAP CDN（补间引擎；加载失败时单步、阶段键与进度仍可用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="title-block">
      <a class="back" href="../index.html#os">&larr; 返回展厅</a>
      <h1>伙伴系统动态分区 <span class="en">Buddy System</span></h1>
      <p class="sub">1024 KB 内存 · 对半切分与伙伴合并 · 进程占用与内部碎片</p>
    </div>
  </header>

  <section class="panel stage" aria-label="演示舞台">
    <div class="stage-status">
      <span class="lamp" id="lamp" aria-hidden="true"></span>
      <span class="step-count" id="step-count">第 0 / 21 步</span>
      <strong class="phase" id="phase">准备就绪</strong>
      <span class="req-line" id="req-line"></span>
    </div>

    <div class="stage-scroll">
      <svg class="stage-svg" id="stage" viewBox="0 0 1100 484" role="img" aria-labelledby="stage-title stage-desc">
        <title id="stage-title">伙伴系统内存分配与回收示意</title>
        <desc id="stage-desc">上方为三个进程的申请卡片；中部为 1024 KB 内存条，按地址排列；下方左侧为各阶空闲链表，右侧为伙伴二叉树。</desc>
        <defs>
          <pattern id="frag-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
            <rect width="8" height="8" fill="#F4F3EE"></rect>
            <line x1="0" y1="0" x2="0" y2="8" stroke="#9AA096" stroke-width="2"></line>
          </pattern>
        </defs>
        <g id="g-static"></g>
        <g id="g-cards"></g>
        <g id="g-bar"></g>
        <g id="g-lists"></g>
        <g id="g-tree"></g>
        <g id="g-fx"></g>
      </svg>
    </div>

    <p class="narr" id="narr" aria-live="polite"></p>

    <ul class="legend" aria-label="图例">
      <li><span class="sw sw-free"></span>空闲（已挂入链表）</li>
      <li><span class="sw sw-loose"></span>待挂入（释放或合并后）</li>
      <li><span class="sw sw-work"></span>切分中</li>
      <li><span class="sw sw-busy"></span>占用（进程色）</li>
      <li><span class="sw sw-frag"></span>内部碎片（斜纹）</li>
    </ul>
  </section>

  <section class="panel controls" aria-label="播放控制">
    <div class="phase-nav" id="phase-nav" role="group" aria-label="阶段"></div>
    <div class="scrub">
      <input id="scrub" class="taste-slider" type="range" min="0" max="21" value="0" aria-label="演示进度（步）">
      <output id="scrub-text" for="scrub">第 0 / 21 步</output>
    </div>
    <div class="transport">
      <button type="button" class="btn" id="btn-replay" title="回到第 0 步（Home）">↺ 重播</button>
      <button type="button" class="btn" id="btn-prev" title="上一步（←）">⏮ 上一步</button>
      <button type="button" class="btn-main" id="btn-play" title="播放或暂停（空格）"><span id="play-text">▶ 播放</span></button>
      <button type="button" class="btn" id="btn-next" title="单步：播放下一步的动画（→）">⏭ 单步</button>
    </div>
    <div class="options">
      <div class="seg" role="group" aria-label="播放速度">
        <button type="button" class="seg-btn" data-speed="0.5" aria-pressed="false">0.5×</button>
        <button type="button" class="seg-btn" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" class="seg-btn" data-speed="1.5" aria-pressed="false">1.5×</button>
        <button type="button" class="seg-btn" data-speed="2" aria-pressed="false">2×</button>
      </div>
      <label class="check"><input type="checkbox" id="reduce"> 减少动效</label>
    </div>
    <p class="notice" id="notice" hidden></p>
  </section>

  <p class="foot">示意：内存以 1 KB 为刻度，不计系统开销与并发。</p>
</div>

<script src="model.js"></script>
<script src="choreo.js"></script>
<script src="app.js"></script>
</body>
</html>
