<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在树与数组的同步映射中，逐步观察建堆、下滤三步与堆排序的归位过程。">
  <title>堆排序 · 双视角映射与下滤三步曲</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 8L8 30M20 8L32 30' stroke='%23343c38' stroke-width='2'/%3E%3Cg fill='%232563eb'%3E%3Ccircle cx='20' cy='8' r='6'/%3E%3Ccircle cx='8' cy='30' r='6'/%3E%3Ccircle cx='32' cy='30' r='6'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#stage">跳到演示舞台</a>
  <main>
    <header class="page-header">
      <div class="heading">
        <a class="back-link" href="../index.html#ds">← 数据结构</a>
        <div class="title-line"><h1>堆排序</h1><span class="english" aria-hidden="true">Heap sort</span></div>
        <p class="subtitle">双视角映射与下滤三步曲</p>
      </div>
      <div class="setup">
        <div class="mode-switch" role="group" aria-label="堆型模式">
          <button type="button" id="mode-max" aria-pressed="true">大根堆 <span>→ 升序</span></button>
          <button type="button" id="mode-min" aria-pressed="false">小根堆 <span>→ 降序</span></button>
        </div>
        <div class="data-line"><span>初始序列</span><span id="data-badge" class="mono"></span><button id="btn-random" type="button">换一组 ↻</button></div>
      </div>
    </header>

    <section id="stage" class="stage" aria-label="堆排序双视角演示" tabindex="-1">
      <nav class="process-track" aria-label="堆排序完整流程">
        <button id="process-0" type="button" data-stage="start"><span class="mono">01</span> 层序建树</button>
        <button id="process-1" type="button" data-stage="adjust"><span class="mono">02</span> 调整成堆</button>
        <button id="process-2" type="button" data-stage="sort"><span class="mono">03</span> 堆排序</button>
        <button id="process-3" type="button" data-stage="done"><span class="mono">04</span> 输出结果</button>
      </nav>
      <div class="stage-heading">
        <div class="stage-status"><i id="status-led" aria-hidden="true"></i><span id="step-counter" class="mono">00</span><span class="status-separator"></span><div><span id="phase-badge">准备</span><h2 id="action-title">序列就绪</h2></div></div>
        <ol class="trio" aria-label="下滤三步曲">
          <li id="trio-1"><span class="mono">01</span> 挑孩子</li>
          <li id="trio-2"><span class="mono">02</span> 比父子</li>
          <li id="trio-3"><span class="mono">03</span> 交换下沉</li>
        </ol>
      </div>
      <div class="stage-meta">
        <div class="legend"><span><i class="focus-key"></i>当前关注</span><span><i class="child-key"></i>选中孩子</span><span><i class="locked-key"></i>已归位</span></div>
        <div class="stats" aria-label="演示统计"><span><span id="heap-caption">待排序</span> <b id="hud-heap">7</b></span><span>已归位 <b id="hud-locked">0</b></span><span>比较 <b id="hud-comp">0</b></span><span>交换 <b id="hud-swap">0</b></span></div>
      </div>
      <p class="scroll-hint">舞台可左右滚动，查看完整的树与数组。</p>
      <div class="diagram-scroll">
        <svg id="heap-svg" viewBox="0 0 1100 580" role="img" aria-labelledby="svg-title svg-desc">
          <title id="svg-title">同一份数据，树与数组两种视角</title>
          <desc id="svg-desc">先从下方输入序列按层序逐个建立完全二叉树，再自底向上调整成堆，随后进行堆排序。交换双方各有一条树到数组的对应线，最终显示完整有序结果。</desc>
          <defs>
            <pattern id="stage-grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.65" fill="#e8e9e2"/></pattern>
          </defs>
          <rect width="1100" height="390" fill="url(#stage-grid)"/>
          <text class="view-label" x="34" y="38">树 · 逻辑结构</text>
          <text class="view-note" x="34" y="60">节点旁标注数组下标</text>
          <text id="tree-count" class="view-note" x="34" y="80">已放入 0 / 7</text>
          <text class="view-note" x="1066" y="38" text-anchor="end">左孩子 2i + 1 · 右孩子 2i + 2</text>
          <g id="edges-group"></g>
          <g id="tree-slots"></g>
          <g id="mapping-lines" aria-hidden="true"></g>
          <circle id="focus-guide" r="38" fill="none" stroke="#2563eb" stroke-width="2"/>
          <g id="tree-nodes"></g>
          <g id="sort-result" opacity="0" visibility="hidden">
            <text id="result-heading" class="result-heading" x="550" y="210" text-anchor="middle">完整排序结果</text>
            <text id="result-values" class="result-values" x="550" y="252" text-anchor="middle"></text>
          </g>
          <g id="event-tag"><rect x="-61" y="-16" width="122" height="30" rx="6" fill="#f4f6ef" stroke="#dce1d5"/><text class="tag-text" text-anchor="middle" y="4"></text></g>
          <line x1="28" y1="385" x2="1072" y2="385" stroke="#e5e4dc"/>
          <text class="view-label" x="34" y="420">数组 · 实际存储</text>
          <text class="view-note" x="1066" y="420" text-anchor="end">悬停或聚焦任一元素，追踪同一份数据</text>
          <g id="array-slots"></g>
          <g id="zone-active"><path fill="none" stroke="#848c83" stroke-width="1.5"/><text class="zone-text" y="558" text-anchor="middle"></text></g>
          <g id="zone-locked"><path fill="none" stroke="#3a8066" stroke-width="1.5"/><text class="zone-text locked-label" y="558" text-anchor="middle"></text></g>
          <g id="array-cells"></g>
        </svg>
      </div>
      <div class="narration"><span class="narration-label">此刻</span><p id="terminal-text" aria-live="polite" aria-atomic="true">树与数组表示同一份数据。</p><span id="mapping-label" class="mapping-label">树 ↔ 数组 · 同步映射</span></div>
    </section>

    <section class="controls" aria-label="播放控制">
      <div class="control-row">
        <div class="transport">
          <button type="button" id="btn-reset" title="回到起点（Home）">↺ <span>重播</span></button>
          <button type="button" id="btn-prev" title="上一步（←）">← <span>上一步</span></button>
          <button type="button" id="btn-play" class="play-button" title="播放或暂停（空格）"><span id="play-icon" aria-hidden="true">▶</span><span id="play-label">播放</span></button>
          <button type="button" id="btn-next" title="下一步（→）"><span>下一步</span> →</button>
        </div>
        <div class="preferences"><label class="speed-control" for="speed-slider">速度 <input id="speed-slider" type="range" min="0.5" max="2" step="0.1" value="1"><output id="speed-value" class="mono" for="speed-slider">1.0×</output></label><label class="motion-control"><input type="checkbox" id="reduce-motion">减少动效</label></div>
      </div>
      <div class="timeline-row"><label for="progress-slider">演示进度</label><input id="progress-slider" type="range" min="0" max="1" step="0.001" value="0" aria-label="演示进度"><output id="time-readout" class="mono" for="progress-slider">0 / 0</output></div>
      <div class="milestones" aria-label="关键状态定位"><button type="button" data-seek="start">起始序列</button><button type="button" data-seek="tree">层序树完成</button><button type="button" data-seek="built">建堆完成</button><button type="button" data-seek="done">排序完成</button><span class="keyboard-hint">空格 播放 / 暂停 · ← → 单步 · Home 重播</span></div>
      <p id="engine-notice" class="engine-notice" role="status" hidden>动画引擎未加载：播放不可用，仍可单步或拖动进度查看全部过程。</p>
    </section>
    <footer>示意：采用 0 起始下标；树与数组表示同一份数据，比较仅统计数值比较。</footer>
  </main>
</body>
</html>
