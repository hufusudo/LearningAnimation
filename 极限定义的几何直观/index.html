<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="通过误差邻域、解析包络和充分门槛，交互理解函数与数列的极限定义。">
  <title>极限定义的几何直观 · 函数与数列</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main>
  <a class="back" href="../index.html#math">← 返回高等数学</a>
  <header class="page-head">
    <div><p class="eyebrow">GEOMETRY OF LIMITS</p><h1>极限定义的几何直观</h1><p class="subtitle">先给精度，再找门槛，看整个尾部。</p></div>
    <div class="segmented" aria-label="极限类型"><button id="mode-continuous" aria-pressed="true">函数极限</button><button id="mode-discrete" aria-pressed="false">数列极限</button></div>
  </header>
  <section class="stage" aria-label="极限几何舞台">
    <div class="stage-head"><div><span id="status-dot" class="dot"></span><span id="time" class="mono">00.0 s</span><span id="phase">给定精度</span></div><span id="expression" class="expression"></span></div>
    <div class="quantifiers" aria-label="量词顺序"><span id="q-epsilon">任给 ε &gt; 0</span><span class="arrow">→</span><span id="q-threshold">存在 X &gt; 0</span><span class="arrow">→</span><span id="q-tail">对所有 x &gt; X，|f(x) − a| &lt; ε</span></div>
    <p class="scroll-hint">坐标舞台可在区域内横向滚动 →</p>
    <div class="plot-scroll" tabindex="0" aria-label="坐标舞台，窄窗口可横向滚动">
      <svg id="limit-svg" viewBox="0 0 1100 490" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">误差邻域与充分门槛</title><desc id="svg-desc">水平开邻域包围极限线，解析误差上界给出充分门槛。门槛右侧尾部严格位于邻域内。</desc>
        <defs><clipPath id="plot-clip"><rect x="82" y="46" width="742" height="340"/></clipPath><pattern id="safe-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="9" stroke="#2d7d62" stroke-opacity=".11"/></pattern></defs>
        <g id="grid"></g>
        <g clip-path="url(#plot-clip)">
          <rect id="safe-area" y="46" height="340" fill="url(#safe-hatch)"/>
          <g id="band"><rect id="band-fill" x="82" width="742" fill="#b97a18" fill-opacity=".09"/><path id="band-lines" fill="none" stroke="#a06c17" stroke-width="1.4" stroke-dasharray="6 5"/></g>
          <path id="envelope" fill="none" stroke="#7d847c" stroke-width="1.4" stroke-dasharray="4 5"/>
          <line id="limit-line" x1="82" x2="824" stroke="#5d655f" stroke-width="1.5"/>
          <path id="curve" fill="none" stroke="#286491" stroke-width="2.5"/>
          <g id="sequence"></g>
          <path id="tail-curve" fill="none" stroke="#2d7d62" stroke-width="3"/>
          <g id="threshold-mark"><line id="threshold-line" y1="46" y2="386" stroke="#9e4a36" stroke-width="1.6" stroke-dasharray="5 4"/><circle id="threshold-open" cy="386" r="4" fill="#fff" stroke="#9e4a36" stroke-width="1.5"/></g>
          <g id="probe"><line id="probe-drop" y2="386" stroke="#286491" stroke-opacity=".3" stroke-dasharray="3 4"/><line id="probe-error" stroke="#286491" stroke-width="3"/><circle id="probe-ring" r="13" fill="none" stroke="#286491"/><circle id="probe-point" r="6" fill="#286491" stroke="#fff" stroke-width="2"/></g>
        </g>
        <path d="M82 40V386H836" fill="none" stroke="#91978e" stroke-width="1.2"/>
        <text x="65" y="28" class="axis-label">y</text><text id="x-axis-label" x="822" y="438" text-anchor="end" class="axis-label">x → +∞</text>
        <text id="a-label" x="70" text-anchor="end" class="axis-label"></text>
        <text id="upper-label" x="90" class="epsilon-text"></text><text id="lower-label" x="90" class="epsilon-text"></text>
        <g id="threshold-tag"><rect width="158" height="31" rx="5" fill="#fff7f3" stroke="#e6c7bb"/><text id="threshold-label" x="79" y="21" text-anchor="middle" class="threshold-text"></text></g>
        <text id="sampling-note" x="82" y="464" class="small"></text>
        <line x1="864" x2="864" y1="45" y2="440" stroke="#e5e4dc"/>
        <text x="894" y="61" class="small">探针 · 真实误差</text>
        <text id="probe-position" x="894" y="95" class="readout"></text>
        <rect x="945" y="136" width="44" height="190" rx="5" fill="#f1f0e9"/>
        <rect id="gauge-band" x="945" y="136" width="44" height="190" rx="5" fill="#f0e3c9"/>
        <line x1="932" x2="1001" y1="326" y2="326" stroke="#5d655f"/>
        <text x="1009" y="331" class="small">0</text>
        <line x1="932" x2="1001" y1="136" y2="136" stroke="#a06c17" stroke-dasharray="4 3"/>
        <text x="1009" y="141" class="epsilon-text">ε</text>
        <line id="gauge-value" x1="934" x2="1000" stroke="#286491" stroke-width="3"/>
        <text id="error-value" x="894" y="364" class="readout"></text>
        <text id="probe-status" x="894" y="391" class="small"></text>
        <text id="guarantee-status" x="894" y="417" class="small"></text>
      </svg>
    </div>
    <div class="proof-row"><span id="proof"></span><span id="epsilon-value" class="mono"></span></div>
    <p id="caption" class="caption" aria-live="polite"></p>
  </section>
  <nav id="steps" class="steps" aria-label="演示阶段"></nav>
  <section class="controls" aria-label="演示控制">
    <div class="play-row"><div class="play-buttons"><button id="replay" aria-label="重播">↺ 重播</button><button id="prev">← 上一步</button><button id="play" class="primary">播放</button><button id="next">下一步 →</button></div><div class="preferences"><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label><input id="reduce-motion" type="checkbox"> 减少动效</label></div></div>
    <label class="progress-label" for="progress"><span>演示进度</span><span id="progress-value" class="mono"></span></label><input id="progress" type="range" min="0" max="18" step="0.01" value="0">
    <p id="engine-notice" class="notice" hidden>动画引擎未加载，播放暂不可用；仍可单步、拖动进度和调节参数。</p>
  </section>
  <section class="explore" aria-label="几何探索参数">
    <div class="field"><label for="model">演示模型</label><select id="model"></select></div>
    <div class="field"><label for="epsilon">起始误差 ε <output id="epsilon-output"></output></label><input id="epsilon" type="range" min="0.16" max="1.2" step="0.02" value="0.7"></div>
    <div class="field"><label for="target">极限值 a <output id="target-output"></output></label><input id="target" type="range" min="-0.5" max="4" step="0.1" value="2"></div>
    <div class="field"><label for="probe-slider">手动探针 <output id="probe-output"></output></label><input id="probe-slider" type="range" min="0.5" max="50" step="0.01" value="0.5"></div>
    <div class="view-row"><label for="view">纵向尺度 <select id="view"><option value="overview">全景</option><option value="detail">邻域细看</option></select></label><span>统一纵向比例，坐标不随探针变形。</span><button id="follow-script">回到演示探针</button></div>
  </section>
  <footer>示意：仅讨论无穷远函数极限与数列极限；有限图窗之外的保证来自解析上界。</footer>
</main>
</body>
</html>
