<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空间曲面方程求解与几何直观 | Visualizer Lab</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'SF Mono', 'monospace']
          },
          colors: {
            stone: {
              50: '#FAF9F5',
              100: '#F4F3EE',
              200: '#E5E4DC',
              300: '#D6D3CD',
              400: '#A8A29E',
              500: '#78716C',
              600: '#57534E',
              700: '#44403C',
              800: '#292524',
              900: '#1C1917'
            }
          }
        }
      }
    }
  </script>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- GSAP for smooth animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- KaTeX for formula rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col bg-[#FAF9F5] text-stone-900 selection:bg-amber-100 selection:text-amber-900 overflow-hidden">

  <!-- Top Header Navigation -->
  <header class="h-14 flex-shrink-0 bg-[#FAF9F5]/90 backdrop-blur border-b border-[#E5E4DC] px-4 lg:px-6 flex items-center justify-between gap-3 z-30">
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
      <a href="../index.html" class="flex items-center gap-1.5 text-xs font-mono text-stone-500 hover:text-stone-900 transition-colors py-1 px-2 rounded-md hover:bg-stone-200/60">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>展厅门户</span>
      </a>
      <div class="h-4 w-[1px] bg-stone-300"></div>
      <div class="w-7 h-7 rounded-lg bg-stone-900 text-white flex items-center justify-center font-mono font-bold text-xs">
        S(r)
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-tight text-stone-900 flex items-center gap-2">
          旋转曲面与锥面方程求解
          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-amber-100/70 text-amber-800 border border-amber-200">几何直观与考点笔记</span>
        </h1>
      </div>
    </div>

    <!-- Case Selector (Pill Tabs with 3 Modes) -->
    <div class="flex items-center bg-[#EBEAE3] p-0.5 rounded-xl border border-[#DCDAD0] text-xs font-medium overflow-x-auto">
      <button id="tab-case1" class="tab-btn active px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
        <span>§8.1 母线非坐标面</span>
      </button>
      <button id="tab-case2" class="tab-btn px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 text-stone-600 hover:text-stone-900">
        <span class="w-2 h-2 rounded-full bg-rose-500"></span>
        <span>§8.2 旋转轴非坐标轴 (考研真题)</span>
      </button>
      <button id="tab-case3" class="tab-btn px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 text-stone-600 hover:text-stone-900">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>§9 锥面及其方程</span>
      </button>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-2">
      <button id="btn-reset-cam" title="重置视角" class="px-2.5 py-1.5 rounded-lg border border-[#E5E4DC] hover:border-stone-400 bg-white text-xs font-mono text-stone-600 hover:text-stone-900 transition-colors flex items-center gap-1 shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span>重置视角</span>
      </button>
      <button id="btn-toggle-explain" class="lg:hidden px-2.5 py-1.5 rounded-lg border border-[#E5E4DC] bg-white text-xs font-medium text-stone-700">
        笔记看板
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 flex flex-col lg:flex-row min-h-0 overflow-hidden relative">

    <!-- Left / Center: 3D Visualization Canvas Area -->
    <section class="flex-1 relative flex flex-col min-h-0 overflow-hidden">
      <!-- Canvas Hook -->
      <div id="canvas-container" class="flex-1 w-full h-full cursor-grab active:cursor-grabbing"></div>

      <!-- Top Overlay: Current Geometric Equations Card -->
      <div class="absolute top-3 left-3 pointer-events-none z-10 max-w-sm">
        <div class="editorial-card p-3 pointer-events-auto bg-white/95 backdrop-blur shadow-sm border border-[#E5E4DC]">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span id="case-badge" class="subtle-badge bg-blue-50 text-blue-700 border-blue-200">
              单叶双曲面生成
            </span>
            <span id="hud-subbadge" class="text-[11px] font-mono text-stone-400">空间几何关系</span>
          </div>

          <div class="space-y-1 text-xs font-mono">
            <div class="flex items-center gap-2">
              <span id="hud-axis-label" class="text-rose-600 font-semibold w-16">旋转轴 L:</span>
              <span id="hud-axis" class="text-stone-700 truncate">z 轴 (0, 0, 1)</span>
            </div>
            <div class="flex items-center gap-2">
              <span id="hud-curve-label" class="text-blue-600 font-semibold w-16">母线 C:</span>
              <span id="hud-curve" class="text-stone-700 truncate">x=1.8, z=1.2y (空间异面线)</span>
            </div>
            <div class="flex items-center gap-2">
              <span id="hud-surface-label" class="text-amber-600 font-semibold w-16">曲面方程:</span>
              <span id="hud-surface" class="font-bold text-stone-900 truncate">(x²+y²)/3.24 - z²/4.67 = 1</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Top-Right Overlay: Layer Visibility Controls -->
      <div class="absolute top-3 right-3 z-10 pointer-events-none">
        <div class="editorial-card px-3 py-2 pointer-events-auto bg-white/95 backdrop-blur shadow-sm border border-[#E5E4DC] flex flex-wrap items-center gap-2 text-xs">
          <span class="text-stone-400 font-mono text-[11px] mr-1">几何图层:</span>

          <label id="layer-label-plane" class="flex items-center gap-1.5 cursor-pointer select-none text-stone-700 hover:text-stone-900">
            <input type="checkbox" id="layer-plane" checked class="rounded border-stone-300 text-teal-600 focus:ring-0">
            <span class="flex items-center gap-1">
              <span class="legend-dot bg-teal-600"></span><span id="layer-text-plane">法截面 π</span>
            </span>
          </label>

          <label id="layer-label-circle" class="flex items-center gap-1.5 cursor-pointer select-none text-stone-700 hover:text-stone-900">
            <input type="checkbox" id="layer-circle" checked class="rounded border-stone-300 text-amber-500 focus:ring-0">
            <span class="flex items-center gap-1">
              <span class="legend-dot bg-amber-500"></span><span id="layer-text-circle">纬圆轨迹</span>
            </span>
          </label>

          <label id="layer-label-radius" class="flex items-center gap-1.5 cursor-pointer select-none text-stone-700 hover:text-stone-900">
            <input type="checkbox" id="layer-radius" checked class="rounded border-stone-300 text-stone-600 focus:ring-0">
            <span class="flex items-center gap-1">
              <span class="legend-dot bg-stone-500"></span><span id="layer-text-radius">到轴矢径/球面</span>
            </span>
          </label>

          <label id="layer-label-surface" class="flex items-center gap-1.5 cursor-pointer select-none text-stone-700 hover:text-stone-900">
            <input type="checkbox" id="layer-surface" checked class="rounded border-stone-300 text-indigo-600 focus:ring-0">
            <span class="flex items-center gap-1">
              <span class="legend-dot bg-indigo-500"></span><span id="layer-text-surface">生成曲面</span>
            </span>
          </label>
        </div>
      </div>

      <!-- Bottom Floating Control Bar -->
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 w-[95%] max-w-2xl">
        <div class="editorial-card px-4 py-3 bg-white/95 backdrop-blur shadow-md border border-[#E5E4DC] flex flex-col gap-2.5">
          <!-- Sliders row -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
            <!-- Parameter t slider -->
            <div class="flex flex-col gap-1">
              <div class="flex items-center justify-between text-xs">
                <span id="label-slider-t" class="text-stone-600 font-medium flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                  母线动点参数 $t$ (位置 $M_1$)
                </span>
                <span id="val-t" class="font-mono text-stone-700 font-semibold">0.60</span>
              </div>
              <input id="slider-t" type="range" min="-2.0" max="2.0" step="0.02" value="0.60" class="cursor-pointer">
            </div>

            <!-- Sweep angle theta slider -->
            <div class="flex flex-col gap-1">
              <div class="flex items-center justify-between text-xs">
                <span id="label-slider-theta" class="text-stone-600 font-medium flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  旋转扫掠角 $\theta$ (动点 $P$)
                </span>
                <span id="val-theta" class="font-mono text-stone-700 font-semibold">220°</span>
              </div>
              <input id="slider-theta" type="range" min="0" max="360" step="1" value="220" class="cursor-pointer">
            </div>
          </div>

          <!-- Bottom Action Buttons & Presets -->
          <div class="flex items-center justify-between pt-2 border-t border-[#EFEFE9] text-xs">
            <!-- Play / Pause Sweep Button -->
            <button id="btn-play-sweep" class="px-3 py-1.5 rounded-lg bg-stone-900 text-white font-medium hover:bg-stone-800 transition-colors flex items-center gap-1.5 shadow-sm">
              <svg id="play-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <span id="play-text">自动扫掠旋转</span>
            </button>

            <!-- Preset / Sub-case toggle -->
            <div class="flex items-center gap-1.5 font-mono text-[11px] text-stone-500">
              <span id="preset-label">模型预设:</span>
              <button id="btn-preset-1" class="px-2 py-1 rounded bg-stone-100 hover:bg-stone-200 text-stone-800 border border-stone-200 transition-colors font-semibold">典型范例</button>
              <button id="btn-preset-2" class="px-2 py-1 rounded bg-white hover:bg-stone-100 text-stone-600 border border-stone-200 transition-colors">进阶变体</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Right: Mathematical Explanation & Step-by-Step Derivation Panel -->
    <aside id="explain-panel" class="w-full lg:w-[480px] xl:w-[520px] flex-shrink-0 bg-white border-l border-[#E5E4DC] flex flex-col h-full overflow-hidden shadow-sm z-20">
      <!-- Panel Header -->
      <div class="p-3.5 border-b border-[#E5E4DC] bg-[#FAF9F5] flex items-center justify-between">
        <div>
          <h2 id="panel-title" class="text-sm font-bold text-stone-900 flex items-center gap-1.5">
            <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span>空间一般旋转曲面求解模型</span>
          </h2>
          <p id="panel-subtitle" class="text-[11px] text-stone-500 mt-0.5">对照考点笔记 · 严格推导与代数消参</p>
        </div>
        <span class="text-[10px] font-mono text-stone-500 bg-stone-100 px-2 py-0.5 rounded border border-stone-200">
          考点精准同步
        </span>
      </div>

      <!-- Panel Scrollable Body (Strictly matches the note) -->
      <div id="dynamic-derivation-content" class="flex-1 overflow-y-auto p-4 space-y-4 text-stone-700 text-xs leading-relaxed">
        <!-- Injected dynamically via app.js -->
      </div>
    </aside>
  </main>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
