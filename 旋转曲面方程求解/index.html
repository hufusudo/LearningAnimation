<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空间曲面方程求解与几何直观 | Visualizer Lab</title>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- GSAP for the camera reset tween (falls back to an instant reset when missing) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- KaTeX for formula rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Tabular numbers for values and formulas -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>

  <!-- Title row and case switch -->
  <header class="hdr">
    <div class="hdr-main">
      <a class="back" href="../index.html#math">← 展厅门户</a>
      <span class="sep" aria-hidden="true"></span>
      <div class="titles">
        <h1>旋转曲面与锥面方程求解</h1>
        <p class="sub">母线绕轴旋转：两个不变量固定坐标关系，消去参数得到方程</p>
      </div>
    </div>
    <div class="hdr-tools">
      <div class="seg" role="group" aria-label="案例">
        <button id="tab-case1" type="button" class="active">§8.1 母线非坐标面</button>
        <button id="tab-case2" type="button">§8.2 旋转轴非坐标轴 (考研真题)</button>
        <button id="tab-case3" type="button">§9 锥面及其方程</button>
      </div>
      <label class="switch" title="开启后步进直接到位，不做补间">
        <input id="reduce" type="checkbox">
        <span class="track" aria-hidden="true"></span>
        <span>减少动效</span>
      </label>
      <button id="btn-reset-cam" type="button" class="btn ghost" title="重置视角">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v5h.6M19.6 15A8 8 0 1 1 18 6.5M19 4v5h-5"/></svg>
        <span>重置视角</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <!-- 3D canvas -->
    <div id="canvas-container" class="canvas" aria-label="三维舞台，拖动可旋转视角"></div>

    <!-- Top-left: current state and equations -->
    <section class="panel hud" aria-label="当前状态与方程">
      <div class="hud-head">
        <h2 id="case-badge">§8.1 单叶双曲面生成</h2>
        <p id="hud-subbadge">模型一：绕坐标轴</p>
      </div>
      <div class="hud-time">
        <span id="lamp" class="led" data-on="false" aria-hidden="true"></span>
        <span id="hud-theta">θ 0°</span>
        <span id="hud-phase" class="phase">第 1 步</span>
      </div>
      <dl class="eqs">
        <div>
          <dt id="hud-axis-label">旋转轴 L:</dt>
          <dd id="hud-axis">z 轴 (0, 0, 1)</dd>
        </div>
        <div>
          <dt id="hud-curve-label">母线 C:</dt>
          <dd id="hud-curve">x=1.8, z=1.2y (空间异面线)</dd>
        </div>
        <div class="key">
          <dt id="hud-surface-label">曲面方程:</dt>
          <dd id="hud-surface">(x²+y²)/3.24 - z²/4.67 = 1</dd>
        </div>
      </dl>
      <div class="layers" role="group" aria-label="几何图层">
        <label class="layer t-wait">
          <input id="layer-plane" type="checkbox" checked>
          <span class="swatch" aria-hidden="true"></span>
          <span id="layer-text-plane">法截面 π</span>
        </label>
        <label class="layer t-gold">
          <input id="layer-circle" type="checkbox" checked>
          <span class="swatch" aria-hidden="true"></span>
          <span id="layer-text-circle">纬圆轨迹</span>
        </label>
        <label class="layer t-ink2">
          <input id="layer-radius" type="checkbox" checked>
          <span class="swatch" aria-hidden="true"></span>
          <span id="layer-text-radius">到轴矢径/球面</span>
        </label>
        <label class="layer t-blue">
          <input id="layer-surface" type="checkbox" checked>
          <span class="swatch" aria-hidden="true"></span>
          <span id="layer-text-surface">生成曲面</span>
        </label>
      </div>
    </section>

    <!-- Top-right: the derivation, step by step -->
    <div id="deriv-wrap" class="deriv-wrap">
      <section class="panel deriv" aria-labelledby="step-title">
        <div class="deriv-head">
          <h2 class="deriv-h">分步推导</h2>
          <span id="step-no">第 1 / 5 步</span>
        </div>
        <div id="steps" class="steps" role="group" aria-label="推导步骤，点击跳到该步起点"></div>
        <div class="rail" aria-hidden="true"><div id="prog"></div></div>
        <h3 id="step-title" class="step-title"></h3>
        <div id="step-formulas" class="step-body"></div>
      </section>
    </div>

    <!-- Bottom-left: narration, parameters and transport -->
    <div class="ctrl-wrap">
      <section class="panel ctrl" aria-label="播放与参数">
        <p id="narration" class="narr" aria-live="polite"></p>

        <div class="sliders">
          <div class="slide">
            <div class="slide-top">
              <label id="label-slider-t" class="slide-label" for="slider-t"></label>
              <output id="val-t" for="slider-t">0.60</output>
            </div>
            <input id="slider-t" class="slider" type="range" min="-2.0" max="2.0" step="0.02" value="0.60">
          </div>
          <div class="slide">
            <div class="slide-top">
              <label id="label-slider-theta" class="slide-label" for="slider-theta"></label>
              <output id="val-theta" for="slider-theta">220°</output>
            </div>
            <input id="slider-theta" class="slider" type="range" min="0" max="360" step="1" value="220">
          </div>
        </div>

        <div class="ctrl-row">
          <div class="transport">
            <button id="btn-prev" type="button" class="btn" title="上一步（←）">上一步</button>
            <button id="btn-play" type="button" class="beam-cta" data-playing="false" title="播放或暂停（空格）"><span id="play-text">播放推导</span></button>
            <button id="btn-next" type="button" class="btn" title="下一步（→）">下一步</button>
            <button id="btn-replay" type="button" class="btn ghost" title="回到第一步并播放（Home）">重播</button>
          </div>
          <div class="presets">
            <span class="seg-label">模型预设</span>
            <div class="seg" role="group" aria-label="模型预设">
              <button id="btn-preset-1" type="button" aria-pressed="true">典型范例</button>
              <button id="btn-preset-2" type="button" aria-pressed="false">进阶变体</button>
            </div>
          </div>
        </div>

        <div class="foot">
          <p id="foot-note" class="note"></p>
        </div>
      </section>
    </div>
  </main>

  <!-- Geometry and steps (model.js), stage, card and controls (app.js) -->
  <script src="model.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
