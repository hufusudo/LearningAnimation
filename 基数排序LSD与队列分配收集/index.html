<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="逐张追踪 LSD 基数排序的数位分配与 FIFO 收集，可暂停、倒退与拖动查看。">
  <title>基数排序 · LSD 与队列分配收集</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <a class="back" href="../index.html#ds">← 返回数据结构</a>
    <header class="page-header">
      <div><h1>基数排序 <span>Radix sort</span></h1><p>最低位优先 · 每一轮，先分配，再按队头收集</p></div>
      <div class="digit-journey" aria-label="数位处理顺序"><span>个</span><i>→</i><span>十</span><i>→</i><span>百</span></div>
    </header>

    <section class="stage" aria-label="基数排序演示舞台">
      <div class="stage-top"><div><span class="status-dot" aria-hidden="true"></span><strong id="clock">t 00.00</strong><span id="phase">准备</span></div><div class="stage-count">本阶段已处理 <strong id="processed">0</strong><span>/ 8</span></div></div>
      <p class="scroll-hint">舞台可左右滚动查看完整队列</p>
      <div class="stage-scroll" tabindex="0" aria-label="算法图示，可横向滚动">
        <svg id="scene" viewBox="0 0 1100 620" role="img" aria-labelledby="scene-title scene-desc">
          <title id="scene-title">基数排序的三轮分配与收集</title>
          <desc id="scene-desc">上方为主序列，下方从左到右为零到九号队列。当前位决定目标桶，队尾从上端加入，队头从下端先出。A 到 H 标记输入身份。</desc>
          <defs>
            <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#3569a1"/></marker>
          </defs>
          <g id="stage-static"></g>
          <path id="route" fill="none" stroke="#3569a1" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
          <g id="bucket-layer"></g>
          <g id="card-layer"></g>
          <g id="event-tag" visibility="hidden"><rect x="-45" y="-16" width="90" height="25" rx="5" fill="#eaf0f7"/><text text-anchor="middle" y="1" class="tag-text"></text></g>
        </svg>
      </div>
      <div class="stage-bottom"><span class="caption-mark" aria-hidden="true"></span><p id="narration" aria-live="polite">从个位开始：依次读取主序列，放入对应数字桶。</p><span class="identity-legend">A–H · 原始顺序</span></div>
    </section>

    <section class="controls" aria-label="演示控制">
      <div class="transport">
        <div class="buttons"><button id="reset" title="回到起点（Home）">↺ 复位</button><button id="prev" title="上一步（←）">← 上一步</button><button id="play" class="primary" title="播放或暂停（空格）"><span id="play-label">播放</span></button><button id="next" title="下一步（→）">下一步 →</button></div>
        <div class="preferences"><label class="speed-label" for="speed">速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speed-value">1.00×</output></label><label class="motion-label"><input id="reduced" type="checkbox">减少动效</label></div>
      </div>
      <div class="progress-row"><label for="progress">演示进度</label><input id="progress" type="range" min="0" max="55" step="0.01" value="0"><output id="step-value">0 / 55</output></div>
      <nav id="rounds" class="rounds" aria-label="轮次跳转"></nav>
      <p id="engine-notice" class="notice" hidden>动画引擎未加载，无法连续播放；仍可单步、拖动进度和切换数据。</p>
    </section>

    <section class="data-controls" aria-label="输入数据">
      <div class="dataset-row"><span class="field-label">数据</span><div class="presets" role="group" aria-label="数据预设"><button data-preset="classic">经典乱序</button><button data-preset="reverse">逆序数据</button><button data-preset="conflict">同位与重复值</button></div><button id="custom-toggle" class="text-button" aria-expanded="false" aria-controls="custom-form">自定义数据</button></div>
      <form id="custom-form" hidden novalidate><label for="custom-input">8 个 0–999 整数，以逗号或空格分隔</label><div class="input-row"><input id="custom-input" type="text" value="278, 109, 063, 930, 589, 184, 505, 269" aria-describedby="input-error" autocomplete="off"><button type="submit">应用数据</button></div><p id="input-error" class="error" role="alert"></p></form>
    </section>
    <footer>示意：十进制非负整数统一补足三位；A–H 表示原始顺序，桶内空位保留。</footer>
  </main>
</body>
</html>
