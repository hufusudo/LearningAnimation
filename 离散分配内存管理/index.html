<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离散分配存储管理 · 逻辑地址到物理地址</title>
  <!-- GSAP CDN（时间线；加载失败时减少动效、单步、上一步与进度条仍可用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div>
      <a class="back" href="../index.html#os">&larr; 返回展厅</a>
      <h1>离散分配存储管理 <span class="en">Discrete Allocation</span></h1>
      <p class="sub">逻辑地址的每个字段去哪里查、查到什么、怎样拼成物理地址</p>
    </div>
    <div class="seg" role="group" aria-label="存储管理方式">
      <button type="button" class="seg-btn" data-mode="paging" aria-pressed="true">基本分页</button>
      <button type="button" class="seg-btn" data-mode="seg" aria-pressed="false">基本分段</button>
      <button type="button" class="seg-btn" data-mode="segpage" aria-pressed="false">段页式</button>
      <button type="button" class="seg-btn" data-mode="twolevel" aria-pressed="false">二级页表</button>
    </div>
  </header>

  <section class="panel" aria-label="演示舞台">
    <div class="stage-status">
      <span class="lamp" id="lamp" aria-hidden="true"></span>
      <span class="step-no" id="step-no">第 0 步</span>
      <span class="phase" id="phase">就绪</span>
      <strong class="action" id="action">就绪</strong>
    </div>

    <svg id="stage" class="stage" viewBox="0 0 1100 470" role="img" aria-labelledby="stage-title stage-desc">
      <title id="stage-title">逻辑地址到物理地址的离散映射</title>
      <desc id="stage-desc">左列为进程的逻辑页或段，中列为页表或段表，右列为主存。按步骤显示表项写入、装入数据，以及一次地址变换：拆分、查表、取块号、拼接、访问主存。</desc>
      <defs>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="7" height="7" fill="#F1F0EA"/>
          <line x1="0" y1="0" x2="0" y2="7" stroke="#C9CCC4" stroke-width="2.5"/>
        </pattern>
        <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
          <path d="M18 0 H0 V18" fill="none" stroke="rgba(0,0,0,.035)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1100" height="470" fill="url(#grid)"/>
      <g id="layer"></g>
    </svg>

    <p class="narr" id="narr" aria-live="polite"></p>
    <ol class="steps" id="steps" aria-label="步骤，点击跳到该步起点"></ol>
  </section>

  <section class="panel controls" aria-label="播放控制">
    <div class="scrub">
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="演示进度">
      <output id="time" for="scrub">0.0 / 0.0 秒</output>
    </div>
    <div class="transport">
      <button type="button" class="btn" id="btn-replay" title="回到第 0 步（Home）">↺ 重播</button>
      <button type="button" class="btn" id="btn-prev" title="上一步（←）">⏮ 上一步</button>
      <button type="button" class="btn-main" id="btn-play" title="播放或暂停（空格）"><span id="play-text">▶ 播放</span></button>
      <button type="button" class="btn" id="btn-next" title="下一步（→）">⏭ 下一步</button>
      <div class="seg" role="group" aria-label="播放速度">
        <button type="button" class="seg-btn" data-speed="0.5" aria-pressed="false">0.5×</button>
        <button type="button" class="seg-btn" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" class="seg-btn" data-speed="1.5" aria-pressed="false">1.5×</button>
        <button type="button" class="seg-btn" data-speed="2" aria-pressed="false">2×</button>
      </div>
      <label class="check"><input type="checkbox" id="reduce"> 减少动效</label>
    </div>
    <p class="notice" id="notice" hidden></p>
  </section>

  <p class="foot">示意：页与页框 4KB，表项 4 字节，分段以 128KB 主存推演，二级页表的地址位取示意宽度。</p>
</div>

<script src="model.js"></script>
<script src="choreo.js"></script>
<script src="app.js"></script>
</body>
</html>
