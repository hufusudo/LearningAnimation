<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="跟随一次 LOAD，观察 TLB 查询、页表访问、缺页调入和原指令重执行。">
  <title>请求分页虚存管理 · 地址如何找到数据</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="header-nav"><a href="../index.html#os">&larr; 返回操作系统</a><span>内存管理 / 虚拟存储</span></div>
    <div class="heading-row"><div><h1>请求分页虚存管理</h1><p>跟随一次 LOAD，从逻辑地址走到真正的数据。</p></div><span class="page-spec">16 位地址 <i> / </i> 页大小 <b>4 KB</b></span></div>
  </header>

  <main>
    <nav class="scenario-nav" aria-label="选择访存场景">
      <button id="pill-sc-a" class="scenario-pill active" data-scenario="A" aria-pressed="true"><span class="scenario-key">A</span><span>TLB 命中<small>直接访问数据</small></span></button>
      <button id="pill-sc-b" class="scenario-pill" data-scenario="B" aria-pressed="false"><span class="scenario-key">B</span><span>查主存页表<small>TLB 未命中，页面已驻留</small></span></button>
      <button id="pill-sc-c" class="scenario-pill" data-scenario="C" aria-pressed="false"><span class="scenario-key">C</span><span>缺页调入<small>先装入页面，再重执指令</small></span></button>
    </nav>

    <section class="stage-shell" aria-label="请求分页地址转换舞台">
      <div class="stage-header">
        <div class="stage-heading"><span class="running-dot" aria-hidden="true"></span><strong id="flow-phase">地址变换</strong><span id="step-number" class="mono">01 / 05</span><span id="scene-time" class="mono">0.0 s</span></div>
        <div class="counters"><span>主存读取 <b id="memory-reads">0</b></span><span>整页调入 <b id="page-transfers">0</b></span><span>页表写入 <b id="table-writes">0</b></span></div>
        <button id="btn-pause-cycle" class="play-btn"><span id="loop-btn-text">暂停</span></button>
      </div>
      <div class="stage-scroll" tabindex="0" aria-label="地址转换图；窄屏可横向滚动">
        <svg id="paging-stage" viewBox="0 0 1120 690" role="img" aria-labelledby="stage-title stage-desc">
          <title id="stage-title">以 MMU 为核心的请求分页地址转换</title>
          <desc id="stage-desc">CPU 在左，MMU 在中央，TLB 在上，页表在下；右侧是八个主存帧与磁盘。当前传输沿高亮连线移动，结果在到达后生效。</desc>
          <defs>
            <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 H 0 V 24" fill="none" stroke="#343C38" stroke-opacity=".025" stroke-width="1"/></pattern>
            <marker id="arrow-active" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="currentColor" stroke-width="1.5"/></marker>
          </defs>
          <rect width="1120" height="690" fill="url(#micro-grid)"/>
          <g id="svg-wires-group" aria-hidden="true"></g>

          <g id="node-cpu" class="hardware-node">
            <rect class="node-surface" x="40" y="205" width="240" height="296" rx="10"/>
            <text class="node-title" x="60" y="233">CPU / 进程</text><text id="cpu-mode-badge" class="node-meta end" x="260" y="233">用户态</text>
            <path class="separator" d="M 60 246 H 260"/>
            <text class="label" x="60" y="267">当前指令</text><text id="cpu-current-inst" class="instruction mono" x="60" y="290">LOAD R0, [0x214A]</text>
            <text class="label" x="60" y="322">逻辑地址 LA</text><text id="cpu-la-hex" class="address mono end" x="260" y="325">0x214A</text>
            <rect id="cpu-os-state-box" class="inset-surface" x="60" y="347" width="200" height="67" rx="5"/>
            <text class="label" x="72" y="369">OS 异常处理</text><text id="os-status-text" class="node-status" x="72" y="395">待命</text>
            <text class="label" x="60" y="448">数据寄存器 R0</text><text id="cpu-data-val" class="register-value mono" x="60" y="480">—</text><text id="cpu-result-status" class="node-meta end" x="260" y="478">等待读取</text>
          </g>

          <g id="node-tlb" class="hardware-node">
            <rect class="node-surface" x="390" y="40" width="320" height="140" rx="10"/>
            <text class="node-title" x="410" y="65">TLB 快表</text><text id="tlb-state-badge" class="node-meta end" x="690" y="65">就绪</text>
            <path class="separator" d="M 410 76 H 690"/>
            <text class="table-head center" x="440" y="94">有效 V</text><text class="table-head center page-ink" x="545" y="94">页号 P</text><text class="table-head center frame-ink" x="650" y="94">帧号 F</text>
            <g id="tlb-table-body"></g>
          </g>

          <g id="node-mmu" class="hardware-node mmu-node">
            <rect class="node-surface" x="390" y="220" width="320" height="195" rx="10"/>
            <path class="mmu-accent" d="M 403 220 H 697"/>
            <text class="node-title" x="410" y="246">MMU</text><text id="mmu-state-badge" class="node-meta end" x="690" y="246">等待逻辑地址</text>
            <rect class="p-field" x="410" y="270" width="76" height="67" rx="5"/>
            <text class="label page-ink" x="421" y="290">P · 高 4 位</text><text id="mmu-p-val" class="field-value mono page-ink" x="421" y="323">—</text>
            <rect class="d-field" x="496" y="270" width="194" height="67" rx="5"/>
            <text class="label" x="508" y="290">D · 低 12 位</text><text id="offset-lock" class="field-note end" x="678" y="290">偏移不变</text><text id="mmu-d-val" class="field-value mono" x="508" y="323">—</text>
            <text class="label frame-ink" x="410" y="362">帧号 F</text><text id="mmu-calc-f" class="field-value mono frame-ink" x="410" y="391">—</text>
            <text class="label" x="496" y="362">PA = F × 0x1000 + D</text><text id="mmu-pa-val" class="address mono" x="496" y="391">—</text>
          </g>

          <g id="node-pt" class="hardware-node">
            <rect class="node-surface" x="390" y="465" width="320" height="180" rx="10"/>
            <text class="node-title" x="410" y="490">主存页表</text><text id="pt-state-badge" class="node-meta end" x="690" y="490">PTBR 0x1000</text>
            <path class="separator" d="M 410 500 H 690"/>
            <text class="table-head center page-ink" x="434" y="518">页号 P</text><text class="table-head center" x="507" y="518">驻留 V</text><text class="table-head center frame-ink" x="580" y="518">帧号 F</text><text class="table-head center" x="653" y="518">磁盘块</text>
            <g id="pt-table-body"></g>
          </g>

          <g id="node-ram" class="hardware-node">
            <rect class="node-surface" x="840" y="85" width="240" height="320" rx="10"/>
            <text class="node-title" x="858" y="111">物理主存</text><text class="node-meta end" x="1062" y="111">4 KB / 帧</text>
            <g id="ram-frames-grid"></g>
          </g>
          <g id="node-disk" class="hardware-node">
            <rect class="node-surface" x="840" y="490" width="240" height="110" rx="10"/>
            <text class="node-title" x="858" y="517">磁盘外存</text><text id="disk-state-badge" class="node-meta end" x="1062" y="517">待命</text>
            <rect class="inset-surface" x="858" y="532" width="204" height="51" rx="5"/>
            <text id="disk-block-label" class="disk-label mono" x="870" y="551">Block 2 · Page 2</text><text id="disk-state-text" class="label" x="870" y="573">本场景无需访问磁盘</text>
          </g>

          <path id="active-wire" class="active-wire" marker-end="url(#arrow-active)" visibility="hidden"/>
          <g id="packet" class="packet" visibility="hidden" aria-hidden="true"><rect id="packet-bg" x="-50" y="-13" width="100" height="26" rx="4"/><text id="packet-text" class="center mono" y="4">LA 0x214A</text></g>
        </svg>
      </div>
      <p class="stage-scroll-hint">图示可横向滚动，完整查看 CPU、MMU 与主存的连接。</p>
      <div class="stage-caption"><span id="step-title">CPU 发出逻辑地址</span><p id="step-detail" aria-live="polite">页号参与地址转换，页内偏移保持不变。</p></div>
    </section>

    <section class="controls" aria-label="演示控制">
      <div class="controls-row">
        <div class="control-buttons"><button id="btn-replay" class="control-btn">↺ 重播</button><button id="btn-prev-step" class="control-btn">← 上一步</button><button id="btn-next-step" class="control-btn">下一步 →</button></div>
        <div class="control-options"><label for="speed-select">速度 <select id="speed-select" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1.0×</option><option value="1.5">1.5×</option><option value="2">2.0×</option></select></label><label><input type="checkbox" id="auto-cycle" checked> 自动切换场景</label><label><input type="checkbox" id="reduce-motion"> 减少动效</label></div>
      </div>
      <div class="progress-row"><span id="playback-status">正在播放</span><input id="progress-slider" type="range" min="0" max="1000" step="1" value="0" aria-label="当前场景进度"><output id="progress-value" for="progress-slider">0%</output></div>
      <div id="step-rail" aria-label="点击定位步骤"></div>
    </section>

    <details class="access-log" id="access-log"><summary><span>访存记录 <span id="log-count" class="mono">0</span></span><span class="summary-hint">查看每次读取、写表与调页的结果</span></summary><div class="log-scroll"><table><thead><tr><th>事件</th><th>阶段</th><th>访问对象</th><th>地址 / 页号</th><th>结果</th><th>访问主存</th><th>说明</th></tr></thead><tbody id="access-log-tbody"></tbody></table></div></details>
    <p class="resource-notice" id="resource-notice" role="status" hidden></p>
  </main>
  <footer>示意：TLB 查询不计主存读取；整页调入、页表写入单独统计。缺页例有空闲帧，并在调页后回填 TLB。页表条目为节选，动画时长不代表实际耗时。</footer>
  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
