<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顺序乘法电路与 [ACC, MQ] 连续移位</title>

  <!-- GSAP 3.12.5：推进步内补间；缺失时播放停用，单步与时刻滑块仍可用 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-motion="full">
  <main class="page">
    <header class="head">
      <a class="back" href="../index.html#co">← 返回实验室</a>
      <h1>顺序乘法电路与 [ACC, MQ] 连续移位</h1>
      <p class="sub">原码一位乘的数值部分：每拍先探测 MQ₀ 决定是否加 X，再让 [ACC, MQ] 整体右移一位</p>
    </header>

    <section class="stage" aria-label="顺序乘法电路舞台">
      <svg id="stage" viewBox="0 0 1100 560" role="img" aria-labelledby="stage-title stage-desc">
        <title id="stage-title">顺序乘法电路示意图</title>
        <desc id="stage-desc">Cout、ACC、MQ 排成一行的寄存器链；X 寄存器与 ALU 在下方，控制逻辑与计数器在右下。每拍探测 MQ₀，必要时把 X 加到 ACC，再让整链右移一位，计数器减 1；走完 4 拍，ACC 与 MQ 拼成积。</desc>
        <g id="layer"></g>
      </svg>
      <p id="caption" class="caption" aria-live="polite"></p>
    </section>
    <p id="notice" class="notice" hidden></p>

    <section class="card controls" aria-label="播放与参数">
      <div class="row">
        <button id="play" type="button" class="beam-cta">▶ 播放</button>
        <button id="prev" type="button" class="tactile">◀ 上一步</button>
        <button id="next" type="button" class="tactile">下一步 ▶</button>
        <button id="replay" type="button" class="tactile">↺ 重播</button>
        <label class="slider-label">速度
          <input id="speed" class="paper-slider" type="range" min="0.5" max="2" step="0.1" value="1">
          <output id="speed-out" class="mono">1.0×</output>
        </label>
        <label class="check"><input id="reduce" type="checkbox"> 减少动效</label>
      </div>

      <div class="row">
        <label class="slider-label grow">时刻
          <input id="scrub" class="paper-slider" type="range" min="0" max="17" step="0.01" value="0">
        </label>
        <output id="time-out" class="mono">第 1 / 17 步</output>
      </div>

      <nav id="stage-bar" class="stage-bar" aria-label="阶段进度"></nav>

      <div class="row params">
        <span class="label">预设</span>
        <div class="seg" role="group" aria-label="预设算式">
          <button type="button" class="seg-btn" data-x="13" data-y="11" aria-pressed="true">13 × 11</button>
          <button type="button" class="seg-btn" data-x="5" data-y="3" aria-pressed="false">5 × 3</button>
          <button type="button" class="seg-btn" data-x="7" data-y="6" aria-pressed="false">7 × 6</button>
          <button type="button" class="seg-btn" data-x="9" data-y="13" aria-pressed="false">9 × 13</button>
          <button type="button" class="seg-btn" data-x="15" data-y="15" aria-pressed="false">15 × 15</button>
        </div>
        <form id="custom" class="row custom" autocomplete="off">
          <label>X <input id="in-x" class="num" type="number" min="0" max="15" value="13"></label>
          <label>Y <input id="in-y" class="num" type="number" min="0" max="15" value="11"></label>
          <button type="submit" class="tactile">应用</button>
        </form>
      </div>
    </section>

    <p class="footnote">示意：只演示 4 位无符号数的数值部分；符号位与进位链的电气细节省略。</p>
  </main>

  <script src="model.js"></script>
  <script src="choreo.js"></script>
  <script src="app.js"></script>
</body>
</html>
