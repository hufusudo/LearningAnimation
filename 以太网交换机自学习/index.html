<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>以太网交换机自学习与兜圈问题 · 帧转发表逐步演示</title>
  <!-- GSAP CDN（补间引擎；加载失败时单步、进度条仍可用） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="title-block">
      <a class="back" href="../index.html#net">&larr; 返回展厅</a>
      <h1>以太网交换机自学习 <span class="en">MAC Learning</span></h1>
      <p class="sub">进门看源 MAC，出门看目的 MAC；两条冗余链路会让同一帧出现两份副本。</p>
    </div>
    <div class="top-controls">
      <div class="seg" role="group" aria-label="视图">
        <button class="seg-btn" type="button" data-view="single" aria-pressed="false">单交换机 · 自学习</button>
        <button class="seg-btn" type="button" data-view="loop" aria-pressed="true">双交换机 · 兜圈</button>
      </div>
      <button id="stp" class="chip-btn" type="button" aria-pressed="false">生成树破环</button>
    </div>
  </header>

  <section class="panel track-panel" aria-label="步骤轨道">
    <div class="track" id="track"></div>
  </section>

  <section class="panel stage-panel" aria-label="演示舞台">
    <div class="stage-status">
      <span class="lamp" id="lamp" aria-hidden="true"></span>
      <span class="step-count" id="step-count">第 1 / 1 步</span>
      <strong class="phase" id="phase">准备就绪</strong>
      <span class="frame-pill" id="frame-pill">无在途帧</span>
      <span class="hint" id="hint"></span>
    </div>

    <div class="stage-wrap">
    <svg class="stage-svg" id="stage-single" viewBox="0 0 1100 560" role="img" aria-labelledby="single-title single-desc" hidden>
      <title id="single-title">单交换机自学习舞台</title>
      <desc id="single-desc">四台主机分别接在交换机的 1 到 4 号端口上。交换机面板内显示 CAM 转发表、源 MAC 学习结果与目的 MAC 查表结果。</desc>
    </svg>

    <svg class="stage-svg" id="stage-loop" viewBox="0 0 1100 560" role="img" aria-labelledby="loop-title loop-desc">
      <title id="loop-title">双交换机兜圈舞台</title>
      <desc id="loop-desc">两台交换机由上下两条冗余链路相连，主机 A、C 接交换机 1，主机 B、D 接交换机 2。数据帧的副本在环路中互相覆写转发表。</desc>
    </svg>
    </div>
    <p class="stage-narrow-hint">左右滑动查看完整拓扑</p>

    <p class="caption" id="caption" aria-live="polite">点击「播放」，或逐步观察帧的进出。</p>
  </section>

  <section class="panel control-panel" aria-label="播放控制">
    <div class="controls">
      <button id="replay" class="btn" type="button">↺ 重播</button>
      <button id="prev" class="btn" type="button">⏮ 上一步</button>
      <button id="play" class="btn btn-primary" type="button"><span id="play-icon">▶</span> <span id="play-text">播放</span></button>
      <button id="next" class="btn" type="button">下一步 ⏭</button>
      <div class="speed" role="group" aria-label="播放速度">
        <span>速度</span>
        <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="1.5" aria-pressed="false">1.5×</button>
        <button type="button" data-speed="2" aria-pressed="false">2×</button>
      </div>
      <label class="toggle"><input type="checkbox" id="reduce"> 减少动效</label>
    </div>

    <div class="scrub">
      <input type="range" id="progress" min="0" max="1" step="0.01" value="0" aria-label="时间进度">
      <span class="scrub-text" id="scrub-text">0.0 s / 0.0 s</span>
    </div>

    <p class="notice" id="notice" hidden></p>
  </section>

  <div class="legend" aria-label="图例">
    <span><i class="dot dot-blue"></i>当前帧</span>
    <span><i class="dot dot-gold"></i>泛洪副本</span>
    <span><i class="dot dot-red"></i>环路 / 阻塞 / 异常</span>
    <span><i class="dot dot-gray"></i>丢弃 / 老化</span>
    <span class="legend-note">表行：绿 = 刚学到 · 红 = 被覆写</span>
  </div>

  <footer class="foot">示意：主机 MAC 与老化时间为示意值；省略前导码、FCS 与冲突检测细节。</footer>

</div>

<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
