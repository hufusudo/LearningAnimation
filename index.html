<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用交互式演示理解高等数学、概率统计与计算机基础。选择学科，观察每一个关键变化。">
  <meta name="theme-color" content="#FAF9F5">
  <title>可视化实验室 · 看见知识的过程</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23343C38'/%3E%3Cpath d='M10 27V12M10 27H30M13 23Q21 24 29 11' fill='none' stroke='%23FAF9F5' stroke-width='2.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="portal.css">
  <script defer src="modules.js"></script>
  <script defer src="portal-model.js"></script>
  <script defer src="portal.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#hub" aria-label="可视化实验室，返回学科大厅">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9"/><path d="M9 25V11M9 25H28M12 22Q20 23 27 10"/></svg>
        <span>可视化实验室</span>
      </a>
      <div class="header-actions">
        <nav class="top-nav" aria-label="主导航">
          <span id="top-nav-indicator" class="nav-indicator" aria-hidden="true"></span>
          <a id="nav-hub" href="#hub"><span class="nav-long">学科大厅</span><span class="nav-short">学科</span></a>
          <a id="nav-all" href="#all"><span class="nav-long">全部演示</span><span class="nav-short">全部</span><span id="header-all-count" class="nav-count">—</span></a>
        </nav>
        <button id="global-search" class="search-shortcut" aria-label="搜索演示，快捷键斜杠" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.5 12.5 4 4"/></svg><span>搜索演示</span><kbd>/</kbd>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <p id="resource-notice" class="resource-notice" role="alert" hidden></p>
    <noscript><p class="resource-notice">请启用 JavaScript 以浏览学科目录和搜索演示。</p></noscript>

    <section id="view-hub" aria-labelledby="hub-title">
      <div class="hub-heading" data-entrance>
        <div>
          <p class="eyebrow">交互式教学演示 <span aria-hidden="true">/</span> VISUAL LEARNING</p>
          <h1 id="hub-title" tabindex="-1">把抽象的过程，看清楚。</h1>
          <p class="intro">从一条曲线到一次访存，选择学科，进入演示。</p>
        </div>
        <dl class="collection-stats">
          <div><dt>交互演示</dt><dd id="hub-total-count">—</dd></div>
          <div><dt>学科方向</dt><dd>6</dd></div>
        </dl>
      </div>

      <div class="workbench" data-entrance>
        <nav class="subject-index" aria-label="选择学科；聚焦可查看概念预览">
          <div class="index-heading"><span>学科索引</span><span>模块</span></div>
          <div id="subject-list" class="subject-list"></div>
          <p class="index-note">指向学科，先看一眼它的过程。</p>
        </nav>
        <section class="preview-panel" aria-labelledby="preview-title">
          <div class="preview-header">
            <div><p id="preview-code" class="eyebrow">01 / MATHEMATICS</p><h2 id="preview-title">高等数学</h2></div>
            <span class="preview-label">概念预览</span>
          </div>
          <div id="preview-visual" class="preview-visual"></div>
          <div class="preview-bottom">
            <div class="preview-list-heading"><span>从这些演示开始</span><a id="preview-open" class="text-link" href="#math">查看学科 <span aria-hidden="true">↗</span></a></div>
            <div id="preview-links" class="preview-links"></div>
          </div>
        </section>
      </div>

      <div class="hub-bottom" data-entrance>
        <a class="collection-link" href="#all"><span>浏览全部演示</span><span id="hub-all-count" class="link-count">—</span><span class="link-arrow" aria-hidden="true">→</span></a>
        <a class="collection-link" href="#cs"><span>计算机 408 全科</span><span id="hub-cs-count" class="link-count">—</span><span class="link-arrow" aria-hidden="true">→</span></a>
      </div>
    </section>

    <section id="view-catalog" aria-labelledby="catalog-title" hidden>
      <a class="back-link" href="#hub"><span aria-hidden="true">←</span> 学科大厅</a>
      <div class="catalog-heading">
        <div><p id="catalog-code" class="eyebrow">全部学科</p><h1 id="catalog-title" tabindex="-1">全部演示</h1><p id="catalog-description" class="intro"></p></div>
        <div class="search-area">
          <label for="filter-search" class="sr-only">搜索当前目录中的演示</label>
          <div class="search-field">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.5 12.5 4 4"/></svg>
            <input id="filter-search" type="search" placeholder="搜索标题、主题或公式" autocomplete="off" aria-controls="projects-grid" aria-describedby="search-help">
            <button id="clear-search" class="clear-search" aria-label="清除搜索" hidden>×</button>
          </div>
          <p id="search-help">按 <kbd>/</kbd> 聚焦搜索，<kbd>Esc</kbd> 清除关键词</p>
        </div>
      </div>
      <nav class="filter-scroll" aria-label="筛选学科">
        <div id="subject-filters" class="filter-row"><span id="filter-indicator" class="filter-indicator" aria-hidden="true"></span></div>
      </nav>
      <div class="results-heading"><h2>演示目录</h2><p id="result-status" role="status" aria-live="polite" aria-atomic="true"></p></div>
      <div id="projects-grid" class="projects-grid"></div>
      <div id="empty-state" class="empty-state" hidden><span class="empty-mark" aria-hidden="true">∅</span><h2>没有匹配的演示</h2><p>试试更短的关键词，或切换学科。</p><button id="empty-clear" class="quiet-button">清除搜索</button></div>
    </section>
  </main>

  <footer class="site-footer"><div><span>可视化实验室</span><span class="footer-note">观察 · 操作 · 理解</span></div><button id="motion-toggle" class="motion-toggle" aria-pressed="false" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 14h14"/><circle cx="7" cy="6" r="2"/><circle cx="13" cy="14" r="2"/></svg><span id="motion-label">减少动效</span></button></footer>
</body>
</html>
