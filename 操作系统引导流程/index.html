<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作系统引导流程 · ROM→MBR→分区引导→内核调入主存</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen antialiased flex flex-col">

  <!-- Header -->
  <header class="border-b border-[#E5E4DC] bg-[#FAF9F5]/90 backdrop-blur px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="font-serif text-xl font-semibold text-stone-900">操作系统引导流程演示</h1>
        <p class="text-xs text-stone-500 font-mono mt-0.5">
          ROM(BIOS) → 磁盘引导(MBR) → 分区引导(DBR) → OS 内核调入主存 · Boot Chain Visualization
        </p>
      </div>
      <a href="../index.html" class="text-xs font-mono text-stone-400 hover:text-stone-700 transition-colors">← 返回展厅</a>
    </div>
  </header>

  <!-- 主体 -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-6 flex flex-col gap-4">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <!-- 画布 -->
      <div class="lg:col-span-2 card-panel rounded-2xl p-4">
        <svg id="boot-svg" viewBox="0 0 1040 620" class="w-full h-auto"></svg>
      </div>

      <!-- 讲解面板 -->
      <div class="flex flex-col gap-4">
        <div class="card-panel rounded-2xl p-5 flex-1">
          <div id="step-badge" class="inline-block px-2.5 py-1 rounded-md text-[11px] font-mono font-semibold bg-blue-50 text-blue-700 border border-blue-200 mb-3">
            STEP 0 / 6
          </div>
          <h2 id="step-title" class="font-serif text-lg font-semibold text-stone-900 mb-2">加电复位：从 ROM 开始</h2>
          <p id="step-desc" class="text-[13px] text-stone-600 leading-relaxed mb-3"></p>
          <div class="bg-stone-50 border border-[#E5E4DC] rounded-lg px-3 py-2">
            <p id="step-micro" class="font-mono text-[11.5px] text-stone-700 leading-relaxed"></p>
          </div>
        </div>

        <!-- 步骤节点 -->
        <div class="card-panel rounded-2xl p-4">
          <p class="text-[11px] font-mono font-bold uppercase tracking-wider text-stone-500 mb-2">引导链 (Boot Chain)</p>
          <div id="step-list" class="flex flex-wrap gap-1.5"></div>
        </div>
      </div>
    </div>

    <!-- 控制条 -->
    <div class="card-panel rounded-2xl px-5 py-3.5 flex items-center gap-4 flex-wrap">
      <button id="btn-play" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-stone-900 text-white hover:bg-stone-700 transition-colors">▶ 播放</button>
      <button id="btn-prev" class="ctl-btn">⏮ 上一阶段</button>
      <button id="btn-next" class="ctl-btn">下一阶段 ⏭</button>
      <button id="btn-restart" class="ctl-btn">↺ 复位</button>

      <div id="scrubber" class="flex-1 min-w-[180px] h-8 flex items-center cursor-pointer touch-none select-none">
        <div class="relative w-full h-1.5 bg-[#E5E4DC] rounded-full">
          <div id="scrub-fill" class="absolute inset-y-0 left-0 bg-blue-600 rounded-full" style="width:0%"></div>
          <div id="scrub-knob" class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-white border-2 border-blue-600 rounded-full" style="left:0%"></div>
        </div>
      </div>
      <span id="time-label" class="font-mono text-xs text-stone-400 tabular-nums">0.0s</span>
    </div>

    <p class="text-center font-mono text-[11px] text-stone-400">
      提示：拖动底部进度条可 60fps 连续 scrub 整个引导过程 · 点击引导链节点可平滑跳转
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
