<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="单行裂变展示分段，逐个比较排头进入悬浮托盘，再整体回填。可暂停、倒退和拖动观察归并排序。">
  <title>归并排序单行裂变与悬浮托盘归并</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <a class="back" href="../index.html#ds">← 数据结构</a>
      <div class="heading"><p class="eyebrow">排序 / 分治</p><h1>归并排序<span>单行裂变与悬浮托盘归并</span></h1>
      <p class="subtitle">分开看边界，合并看排头；同一批元素，始终可追踪。</p></div>
      <span class="english" aria-hidden="true">Merge sort</span>
    </header>

    <section class="stage" aria-label="归并排序演示舞台">
      <div class="stage-header">
        <div class="stage-state"><span id="status-led" class="status-led" aria-hidden="true"></span><span class="time">t <strong id="time-readout">0.00</strong></span><span id="phase">就绪</span></div>
        <div class="stats"><span>比较 <strong id="stat-cmp">0</strong></span><span>入盘 <strong id="stat-mv">0</strong></span></div>
      </div>
      <div class="stage-scroll" tabindex="0" aria-label="排序图示，窄屏可横向滚动">
        <svg id="stage-svg" viewBox="0 0 1100 420" role="img" aria-labelledby="svg-title svg-desc">
          <title id="svg-title">单行裂变与悬浮托盘归并</title>
          <desc id="svg-desc">原数组保持一行，用间隙表达分段；L和R标出左右排头，较小元素逐个移入下方辅助托盘，等值优先取左，之后整体回填并合拢。</desc>
          <text class="lane-label" x="26" y="118">原数组</text>
          <text class="lane-note" x="26" y="138">A</text>
          <g id="tray-layer"></g>
          <g id="holes-layer"></g>
          <g id="groups-layer"></g>
          <g id="focus-layer"></g>
          <g id="indices-layer"></g>
          <line id="flight-path" class="flight-path"/>
          <g id="cards-layer"></g>
          <g id="pointers-layer"></g>
          <g id="comparison-group"><text id="comparison" x="550" y="250" text-anchor="middle"></text></g>
          <g id="cut-group"><line id="cut-line" class="cut-line"/><text id="cut-label" class="cut-label" text-anchor="middle"></text></g>
          <rect id="guide-ring" width="80" height="86" rx="15" class="guide-ring"/>
          <g id="event-tag"><rect x="-68" y="-18" width="136" height="30" rx="5"/><text id="tag-text" text-anchor="middle" y="2"></text></g>
        </svg>
      </div>
      <div class="narrow-hint">← 舞台可横向滚动 →</div>
      <div class="stage-footer">
        <p id="caption" aria-live="polite">同一行中观察分段，再把相邻有序段归并。</p>
        <div class="legend"><span><i class="legend-l"></i>L 左排头</span><span><i class="legend-r"></i>R 右排头</span><span><i class="legend-sorted"></i>有序区间</span></div>
      </div>
    </section>

    <section class="controls" aria-label="播放与数据控制">
      <div class="control-row">
        <div class="transport">
          <button id="btn-reset" class="tactile" title="回到起点（Home）">↺ 重播</button>
          <button id="btn-prev" class="tactile" title="上一个事件（←）">← 上一步</button>
          <button id="btn-play" class="beam" title="播放或暂停（空格）"><span class="beam-inner"><span id="play-icon" aria-hidden="true">▶</span><span id="play-label">播放</span></span></button>
          <button id="btn-next" class="tactile" title="下一个事件（→）">下一步 →</button>
        </div>
        <div class="play-options">
          <label class="speed" for="speed">速度<input id="speed" type="range" min="0.5" max="3" step="0.25" value="1"><output id="speed-readout" for="speed">1×</output></label>
          <label class="motion"><input id="reduced-motion" type="checkbox">减少动效</label>
        </div>
      </div>
      <div class="progress-row"><label for="progress">演示进度</label><input id="progress" type="range" min="0" max="1" step="0.01" value="0"><output id="step-readout" for="progress">0 / 0</output></div>
      <nav id="milestones" class="milestones" aria-label="关键阶段跳转"></nav>
      <div class="data-row"><label for="preset">示例数据</label><select id="preset"><option value="classic">初始序列 · 观察 49a / 49b</option><option value="reverse">逆序序列</option><option value="duplicates">重复值序列</option><option value="random" hidden>随机序列</option></select><button id="btn-random" class="text-button">换一组随机数 ↗</button><span class="keyboard-hint">空格 播放 / ← → 单步 / Home 重播</span></div>
      <p id="engine-notice" class="notice" hidden>动画引擎未加载，仍可用单步、进度条和阶段键浏览完整过程。</p>
    </section>
    <footer>示意：切分按层展示；入盘次数不含回填；a/b 标记相同值的原始次序。</footer>
  </main>
</body>
</html>
