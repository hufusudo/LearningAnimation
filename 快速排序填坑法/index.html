<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="从双指针交替填坑到完整递归，用可回放的每一个动作理解快速排序。">
  <title>快速排序全流程可视化</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header class="page-head">
      <div>
        <a class="back-link" href="../index.html#ds">← 数据结构</a>
        <h1>快速排序<span class="english">Quicksort</span></h1>
        <p class="subtitle">一处填坑，一次归位，再把剩下的区间交给递归。</p>
      </div>
      <div class="mode-switch" role="group" aria-label="演示模式">
        <button id="mode-recursive" aria-pressed="true">完整递归</button>
        <button id="mode-single" aria-pressed="false">单趟划分</button>
      </div>
    </header>

    <form id="data-form" class="data-bar" novalidate>
      <label class="preset-label" for="preset-select">输入序列</label>
      <select id="preset-select" aria-label="选择数据预设">
        <option value="classic">教材经典</option>
        <option value="sorted">升序序列</option>
        <option value="descending">降序序列</option>
        <option value="duplicates">含重复值</option>
        <option value="custom">自定义</option>
      </select>
      <input id="input-array" aria-label="待排序整数序列" aria-describedby="input-error" value="49, 38, 65, 97, 76, 13, 27" autocomplete="off" spellcheck="false">
      <button type="submit" class="small-button">应用序列</button>
      <button id="btn-random" type="button" class="text-button">随机一组 ↗</button>
      <span id="input-error" class="input-error" role="alert"></span>
    </form>

    <section class="workspace" aria-label="快速排序演示舞台">
      <div class="stage-head">
        <div class="stage-status"><span id="status-dot" class="status-dot"></span><span id="step-counter" class="mono">000</span><span class="status-divider">/</span><span id="phase-name">准备就绪</span></div>
        <div class="stats">
          <span>比较 <strong id="stat-comparisons">0</strong></span>
          <span>搬移 <strong id="stat-moves">0</strong></span>
          <span>归位 <strong id="stat-locked">0 / 7</strong></span>
        </div>
      </div>
      <p class="scroll-hint">左右滑动查看完整数组</p>
      <div class="stage-scroll">
        <svg id="array-svg" viewBox="0 0 1100 320" role="img" aria-labelledby="array-title array-desc">
          <title id="array-title">快速排序的数组、双指针与暂存基准</title>
          <desc id="array-desc">虚线格表示坑，金色托盘暂存基准，归位元素带勾。下方解说说明当前动作。</desc>
          <g id="range-layer"></g>
          <g id="slot-layer"></g>
          <g id="tray-layer">
            <text x="962" y="30" text-anchor="middle" class="svg-label">暂存基准 pivot</text>
            <rect x="929" y="43" width="66" height="59" rx="10" class="tray"></rect>
            <text x="962" y="78" text-anchor="middle" class="tray-empty">未暂存</text>
          </g>
          <path id="flight-path" class="flight-path" fill="none"></path>
          <g id="token-layer"></g>
          <g id="focus-layer"></g>
          <g id="pointer-layer"></g>
          <g id="tag-layer"></g>
          <text id="range-label" x="48" y="42" class="svg-label">准备调用根区间</text>
        </svg>
      </div>
      <div class="stage-foot">
        <p id="narration" aria-live="polite">从整个数组开始，先暂存首元素。</p>
        <div class="legend" aria-label="图例"><span><i class="key-active"></i>当前区间</span><span><i class="key-pivot"></i>基准</span><span><i class="key-hole"></i>坑</span><span><i class="key-done"></i>已归位 ✓</span></div>
      </div>
    </section>

    <section class="controls" aria-label="播放控制">
      <div class="control-row">
        <div class="transport">
          <button id="btn-reset" title="回到起点（Home）">↺ <span>复位</span></button>
          <button id="btn-prev" title="上一步（←）">← <span>上一步</span></button>
          <button id="btn-play" class="play-button" title="播放或暂停（空格）">▶ 播放</button>
          <button id="btn-next" title="下一步（→）"><span>下一步</span> →</button>
        </div>
        <div class="play-options">
          <button id="btn-partition" class="text-button">跳到本趟归位 ↗</button>
          <label class="speed-label">速度 <select id="speed-select"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
          <label class="motion-label"><input type="checkbox" id="reduce-motion">减少动效</label>
        </div>
      </div>
      <div class="progress-row"><span class="mono" id="time-label">0 / 0</span><input type="range" id="progress" min="0" max="1" step="0.01" value="0" aria-label="演示进度"><span class="progress-end">终点</span></div>
      <p id="engine-notice" class="engine-notice" hidden>动画引擎未加载，播放不可用；仍可单步、拖动进度或切换数据。</p>
    </section>

    <section class="recursion-panel" aria-label="递归联动视图">
      <div class="tree-panel">
        <div class="section-head"><h2>递归路径 <span>先左，后右</span></h2><span class="quiet" id="tree-hint">点击已调用节点，回看入口</span></div>
        <div id="tree-scroll" class="tree-scroll"><svg id="tree-svg" role="group" aria-label="递归调用树"><title>递归调用树：当前调用、等待返回、已返回</title><g id="tree-links"></g><g id="tree-nodes"></g></svg></div>
        <div class="tree-legend"><span>实线框：当前调用</span><span>浅色框：等待或尚未调用</span><span>✓ 已返回</span></div>
      </div>
      <aside class="stack-panel">
        <div class="section-head"><h2>调用栈 <span>栈顶在上</span></h2><span class="mono" id="stack-depth">0 层</span></div>
        <div class="stack-scroll"><svg id="stack-svg" role="img" aria-labelledby="stack-title"><title id="stack-title">运行中的递归调用栈</title><g id="stack-frames"></g><text id="stack-empty" x="165" y="60" text-anchor="middle" class="svg-label">尚无调用</text></svg></div>
        <p class="stack-summary">本次已达最大深度 <strong id="max-depth">0</strong> 层<span id="stack-note">从根区间开始</span></p>
      </aside>
    </section>
    <footer>示意：固定首元素为基准；比较仅计关键字比较，搬移含暂存与归位，调用栈含空区间。</footer>
  </main>
</body>
</html>
