<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>以太网 VLAN 与 802.1Q 帧 · 帧流动演示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="title-block">
      <a class="back" href="../index.html#net">← 返回计算机网络</a>
      <h1>以太网 VLAN 与 802.1Q 帧 <span class="en">VLAN Tag</span></h1>
      <p class="sub">跟着一帧从主机 A 走到主机 E：Access 打标、按 VID 转发、Trunk 带标、出向剥标。</p>
    </div>
    <ul class="legend" aria-label="图例">
      <li><i class="dot v10" aria-hidden="true"></i>VLAN 10</li>
      <li><i class="dot v20" aria-hidden="true"></i>VLAN 20</li>
      <li><i class="dot trunk" aria-hidden="true"></i>Trunk</li>
      <li><i class="xmark" aria-hidden="true">✕</i>未转发</li>
    </ul>
  </header>

  <!-- 帧结构：规格条。两行字段对齐，能看出 4 字节标签插在哪、帧长怎么变 -->
  <section class="spec" aria-labelledby="spec-title">
    <div class="spec-head">
      <h2 id="spec-title">802.1Q 帧结构</h2>
      <p>标签插在源 MAC 与类型之间，交换机靠它识别 VLAN</p>
    </div>
    <svg class="spec-svg" viewBox="0 0 1120 88" role="img" aria-labelledby="spec-svg-title spec-svg-desc">
      <title id="spec-svg-title">标准以太网帧与 802.1Q 帧的字段对照</title>
      <desc id="spec-svg-desc">标准帧 1518 字节：目的地址 6 字节、源地址 6 字节、类型 2 字节、数据 1500 字节、帧校验 4 字节。
        802.1Q 帧 1522 字节：在源地址与类型之间插入 4 字节标签，含 2 字节 TPID 0x8100 与 2 字节 TCI（PRI 3 位、CFI 1 位、VID 12 位）。</desc>

      <g class="spec-row" id="spec-plain">
        <text class="spec-label" x="0" y="24">未打标 · 1518 B</text>
        <g class="cell"><rect x="140" y="8" width="56" height="22" rx="4"/><text x="168" y="23">DA 6B</text></g>
        <g class="cell"><rect x="197" y="8" width="56" height="22" rx="4"/><text x="225" y="23">SA 6B</text></g>
        <g class="cell"><rect x="254" y="8" width="40" height="22" rx="4"/><text x="274" y="23">Type</text></g>
        <g class="cell"><rect x="295" y="8" width="118" height="22" rx="4"/><text x="354" y="23">Data 1500 B</text></g>
        <g class="cell"><rect x="414" y="8" width="40" height="22" rx="4"/><text x="434" y="23">FCS</text></g>
      </g>

      <g class="spec-row" id="spec-tag">
        <text class="spec-label" x="0" y="52">802.1Q · 1522 B</text>
        <g class="cell"><rect x="140" y="36" width="56" height="22" rx="4"/><text x="168" y="51">DA 6B</text></g>
        <g class="cell"><rect x="197" y="36" width="56" height="22" rx="4"/><text x="225" y="51">SA 6B</text></g>
        <g class="cell" data-vid="tag"><rect x="254" y="36" width="57" height="22" rx="4"/><text x="282.5" y="51">TPID 2B</text></g>
        <g class="cell" data-vid="tag"><rect x="312" y="36" width="57" height="22" rx="4"/><text x="340.5" y="51">TCI 2B</text></g>
        <g class="cell"><rect x="370" y="36" width="40" height="22" rx="4"/><text x="390" y="51">Type</text></g>
        <g class="cell"><rect x="411" y="36" width="118" height="22" rx="4"/><text x="470" y="51">Data 1500 B</text></g>
        <g class="cell"><rect x="530" y="36" width="40" height="22" rx="4"/><text x="550" y="51">FCS</text></g>
      </g>

      <line class="spec-insert" x1="254" y1="4" x2="254" y2="66"></line>
      <path class="spec-bracket" d="M254 66 H369"></path>
      <text class="spec-plus" x="311.5" y="80">+4B 标签</text>

      <g class="spec-notes">
        <text class="n1" x="620" y="16">TPID 恒为 0x8100，用来识别 802.1Q 标签</text>
        <text class="n1" x="620" y="36">TCI = PRI 3 bit ｜ CFI 1 bit ｜ VID 12 bit</text>
        <text class="n2" x="620" y="56">VID 取 0–4095（0 与 4095 保留），本演示 VID = 10</text>
        <text class="n2" x="620" y="76">最大帧长 1518 → 1522 B；最小帧 64 B 时数据 46 → 42 B</text>
      </g>
    </svg>
  </section>

  <!-- 主舞台 -->
  <section class="panel stage" aria-label="VLAN 帧流动演示">
    <div class="stage-status">
      <span class="lamp" id="lamp" aria-hidden="true"></span>
      <span class="step-count" id="step-count">第 1 / 6 步</span>
      <strong class="phase" id="phase">发送</strong>
      <span class="scope" id="scope">A → P1 · 未打标</span>
    </div>

    <div class="sand">
      <svg id="stage" viewBox="0 0 1120 386" role="img" aria-labelledby="stage-title stage-desc">
        <title id="stage-title">两台交换机与十二台主机的 VLAN 拓扑</title>
        <desc id="stage-desc">交换机 1 的 P1–P4 与交换机 2 的 P2、P3 属于 VLAN 10；交换机 1 的 P5–P7 与交换机 2 的 P4–P6 属于 VLAN 20；
          两台交换机用 P8–P1 的 Trunk 链路相连。一颗帧从主机 A 发出，在各端口之间流动。</desc>
      </svg>
    </div>

    <p class="narr" id="narr" aria-live="polite"></p>
    <p class="sand-hint">← 左右滑动查看完整拓扑</p>
  </section>

  <ol class="steps" id="steps" aria-label="六个阶段，点击跳转"></ol>

  <section class="panel controls" aria-label="播放控制">
    <div class="scrub">
      <input id="scrub" class="taste-slider" type="range" min="0" max="15.4" step="0.01" value="0" aria-label="演示进度（秒）">
      <output id="scrub-text" for="scrub">t = 0.0 s</output>
    </div>
    <div class="transport">
      <button type="button" class="btn" id="btn-replay" title="回到开头（Home）">↺ 重播</button>
      <button type="button" class="btn" id="btn-prev" title="上一步（←）">⏮ 上一步</button>
      <button type="button" class="btn-main" id="btn-play" title="播放或暂停（空格）"><span id="play-text">▶ 播放</span></button>
      <button type="button" class="btn" id="btn-next" title="单步：走完这一步（→）">⏭ 单步</button>
      <div class="options">
        <div class="seg" role="group" aria-label="播放速度">
          <button type="button" class="seg-btn" data-speed="0.5" aria-pressed="false">0.5×</button>
          <button type="button" class="seg-btn" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" class="seg-btn" data-speed="1.5" aria-pressed="false">1.5×</button>
          <button type="button" class="seg-btn" data-speed="2" aria-pressed="false">2×</button>
        </div>
        <label class="check"><input type="checkbox" id="reduce"> 减少动效</label>
      </div>
    </div>
    <p class="notice" id="notice" hidden></p>
  </section>

  <p class="foot">示意：略去 STP、MAC 地址学习与转发时延；帧长按最大 1518 B / 1522 B 计。</p>
</div>

<script src="model.js"></script>
<script src="choreo.js"></script>
<script src="app.js"></script>
</body>
</html>
