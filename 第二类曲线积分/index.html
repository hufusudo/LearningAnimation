<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FAF9F5">
  <title>第二类曲线积分 · 变力做功实验台</title>
  <meta name="description" content="沿有向曲线分段，观察力与位移的分量怎样组成微段功，再逐段汇入第二类曲线积分。">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="model.js"></script>
  <script defer src="choreo.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header"><a href="../index.html#math">← 返回高等数学</a><span>可视化实验室</span></header>
  <main>
    <div class="title-row"><div><h1>变力做功实验台</h1><p class="subtitle">第二类曲线积分：看一小段功，怎样沿路累加。</p></div><div class="title-formula">W = ∫<sub>L</sub> F · dr<span>= ∫<sub>L</sub> P dx + Q dy</span></div></div>
    <section class="parameters" aria-label="实验参数">
      <label>路径<select id="path-select"><option value="parabola">抛物线弧段</option><option value="polyline">折线路径</option><option value="semicircle">上半圆弧</option></select></label>
      <label>力场<select id="field-select"><option value="vortex">旋转场 F = (−y, x)</option><option value="radial">径向场 F = (x, y)</option><option value="constant">恒力 F = (1.3, 0.7)</option></select></label>
      <label>分段数<select id="partition-select"><option value="6">6 段</option><option value="12" selected>12 段</option><option value="24">24 段</option></select></label>
      <button id="reverse-button" aria-pressed="false">切换方向 <span id="direction">A → B</span></button>
      <div class="focus-controls" role="group" aria-label="分量聚焦"><span>聚焦</span><button data-focus="all" aria-pressed="true">全部</button><button data-focus="x" aria-pressed="false">水平</button><button data-focus="y" aria-pressed="false">竖直</button></div>
    </section>
    <section class="stage" aria-label="变力做功演示舞台">
      <div class="stage-heading"><div><span id="status-dot" class="status-dot"></span><span id="clock">t = 0.0 s</span><span class="separator">/</span><strong id="segment-label">第 1 / 12 段</strong></div><span id="phase-label">取一小段</span></div>
      <nav class="phase-nav" aria-label="当前段的演示步骤"><button data-phase="0">1 <span>取一小段</span></button><button data-phase="1">2 <span>水平做功</span></button><button data-phase="2">3 <span>竖直做功</span></button><button data-phase="3">4 <span>两项相加</span></button><button data-phase="4">5 <span>汇入积分</span></button></nav>
      <p class="stage-hint">图示可左右滑动查看 →</p>
      <div class="stage-scroll" tabindex="0" aria-label="演示图，窄窗口可在此横向滚动">
        <svg id="work-svg" viewBox="0 0 1120 540" role="img" aria-labelledby="svg-title svg-description"><title id="svg-title">分段做功与沿程累加</title><desc id="svg-description">左侧在力场中选取有向路径的一段；右侧依次展示力与位移的水平、竖直投影；该段功随后飞入下方的正负功柱并计入总和。</desc><g id="static-scene"></g><g id="dynamic-scene"></g></svg>
      </div>
      <div class="stage-foot"><p id="caption" aria-live="polite">先沿有向路径取一小段，在该段中点取力。</p><span id="completion">已汇入 0 / 12 段</span></div>
    </section>
    <section class="controls" aria-label="播放控制">
      <div class="transport"><button id="reset-button" title="重播（Home）">重播</button><button id="prev-button" title="上一步（←）">← 上一步</button><button id="play-button" class="primary" aria-label="播放">▶ 播放</button><button id="next-button" title="下一步（→）">下一步 →</button><label class="speed">速度<select id="speed-select"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label class="motion"><input id="reduced-motion" type="checkbox">减少动效</label></div>
      <div class="progress-row"><span>演示进度</span><input id="progress-input" type="range" min="0" max="10000" step="1" value="0" aria-label="演示进度"><output id="progress-value">0%</output></div>
      <p id="engine-notice" class="notice" hidden>动画引擎未加载，播放不可用；仍可单步、拖动进度并切换参数。</p>
      <p class="keyboard-hint">空格播放 / 暂停 · ← → 逐步 · Home 重播<span id="motion-notice" hidden> · 减少动效：按事件末状态浏览</span></p>
    </section>
    <p class="method-note">示意：有向弦分段近似曲线，中点取力，Wₙ = Σ ΔWᵢ ≈ ∫<sub>L</sub> F · dr；坐标 m，力 N，功 J。</p>
  </main>
</body>
</html>
